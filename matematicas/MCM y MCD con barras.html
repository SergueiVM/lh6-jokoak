<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MCM y MCD con barras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of rounded cards, big tap targets. Menu -> round (one question per screen) -> results. Same warm palette as the games index; coral and indigo bars carry the two numbers through every model. */

  --cb:#5b4bdb; --cb-bg:#e4e0ff; --cb-line:rgba(91,75,219,.35);

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff;

  --cb:#a89dff; --cb-bg:#383069; --cb-line:rgba(168,157,255,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;

/* ---- bar models ---- */
.model{display:grid;gap:12px;margin:10px 0 14px;min-width:0}

.pp{flex:1;display:grid;place-items:center;min-width:0;font-weight:800;font-size:15px;background:var(--ca-bg);box-shadow:inset 0 0 0 2px var(--ca);border-right:3px solid var(--card)}
.pp.b{background:var(--cb-bg);box-shadow:inset 0 0 0 2px var(--cb)}
.pbar{height:40px}

.track .rr{height:100%;border-radius:4px}

.tctl .sq.plus{border-color:var(--pri);background:var(--pri);color:var(--on-pri)}
.tctl .sq:disabled{opacity:.4;cursor:default}

@media (prefers-reduced-motion:no-preference){.pc,.pp{transition:flex .15s}}

<main id="app"></main>

<script>
/* ---------- utilities ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const ri=(a,b)=>a+rnd(b-a+1);
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const divs=n=>{const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r;};
const mults=(n,k)=>Array.from({length:k},(_,i)=>n*(i+1));
const uniq=a=>[...new Set(a)];
const SUP=["⁰","¹","²","³","⁴","⁵","⁶","⁷"];
function factor(n){const f={};for(let p=2;n>1;p++)while(n%p===0){f[p]=(f[p]||0)+1;n/=p;}return f;}
const fmtF=f=>Object.keys(f).map(Number).sort((a,b)=>a-b).map(p=>f[p]>1?p+SUP[f[p]]:""+p).join(" · ");
const prodF=f=>Object.keys(f).reduce((s,p)=>s*Math.pow(+p,f[p]),1);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.,;:!?¿¡()]+/g,"").replace(/\s+/g," ").trim();
const NAMES=["Ane","Mikel","Leire","Unai","Maite","Iker","Nerea","Aitor","Jon","Naroa"];
const twoNames=()=>pickN(NAMES,2);

/* pairs of numbers whose MCD is exactly d (m and n have no common factor) */
function pairMCD(max,o){
  o=o||{};const dmin=o.dmin||2,dmax=o.dmax||12;
  for(let t=0;t<2000;t++){
    const d=ri(dmin,dmax),top=Math.floor(max/d);if(top<2)continue;
    const m=ri(1,top),n=ri(1,top);
    if(m===n||gcd(m,n)!==1)continue;
    if((m===1||n===1)&&Math.random()<.7)continue;
    const a=d*m,b=d*n;if(a<4||b<4)continue;
    return Math.random()<.5?[a,b]:[b,a];
  }
  return [12,18];
}
function pairMCM(maxL,lo,hi){
  lo=lo||3;hi=hi||9;
  for(let t=0;t<2000;t++){
    const a=ri(lo,hi),b=ri(lo,hi);if(a===b)continue;
    if(lcm(a,b)>maxL)continue;
    if((a%b===0||b%a===0)&&Math.random()<.85)continue;
    return [a,b];
  }
  return [4,6];
}
function fresh(used,gen){
  let p;
  for(let i=0;i<40;i++){p=gen();const k="p"+p.slice().sort((x,y)=>x-y).join("-");if(!used.has(k)){used.add(k);return p;}}
  return p;
}
/* four numeric options: the right one plus three wrong ones that pass okf */
function numOpts(c,cands,okf){
  okf=okf||(()=>true);
  const w=[],used=new Set([c]);
  for(const x of shuffle(cands)){
    if(Number.isInteger(x)&&x>0&&!used.has(x)&&okf(x)){used.add(x);w.push(x);if(w.length===3)break;}
  }
  for(let k=1;w.length<3&&k<300;k++)for(const x of [c+k,c-k]){
    if(w.length<3&&x>0&&!used.has(x)&&okf(x)){used.add(x);w.push(x);}
  }
  return [c].concat(w);
}
function pairOpts(c,cands,fmt){
  const key=p=>p[0]+","+p[1],used=new Set([key(c)]),w=[];
  for(const p of shuffle(cands)){
    if(p[0]>=0&&p[1]>=0&&!used.has(key(p))){used.add(key(p));w.push(p);if(w.length===3)break;}
  }
  for(let k=1;w.length<3&&k<60;k++){const p=[c[0]+k,c[1]];if(!used.has(key(p))){used.add(key(p));w.push(p);}}
  return [c].concat(w).map(fmt);
}

/* ---------- tiny DOM helpers ---------- */
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==="class")e.className=v;
    else if(k==="onclick")e.onclick=v;
    else if(k==="text")e.textContent=v;
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  add(e,...kids);return e;
}
function add(p,...k){k.flat().forEach(x=>{if(x!=null&&x!==false)p.append(x);});return p;}
const line=t=>h("p",{class:"line",text:t});

/* ---------- bar-model drawing ---------- */
/* a bar of `total` unit cells cut into pieces of `size`; what is left over is hatched */
function unitBar(total,size,color,maxT){
  const bar=h("div",{class:"ub"});bar.style.width=(total/maxT*100)+"%";
  const full=Math.floor(total/size),rest=total-full*size;
  const piece=(n,cls)=>{const p=h("div",{class:"pc "+cls});p.style.flex=n+" 1 0%";for(let k=0;k<n;k++)p.append(h("i"));return p;};
  for(let i=0;i<full;i++)bar.append(piece(size,color));
  if(rest)bar.append(piece(rest,"left"));
  return bar;
}
function ribbonRow(name,total,size,color,maxT,unit){
  return h("div",null,h("div",{class:"rl"},h("b",{text:name}),h("span",{text:total+" "+(unit||"cm")})),unitBar(total,size,color,maxT));
}
const ribbons=(a,b,size,unit)=>h("div",{class:"model"},
  ribbonRow("Cinta roja",a,size,"a",Math.max(a,b),unit),ribbonRow("Cinta azul",b,size,"b",Math.max(a,b),unit));
/* a row of `count` rods of length `len` laid end to end */
function rodRow(len,count,color,cap,o){
  o=o||{};
  const row=h("div",{class:"rr"});row.style.width=(len*count/cap*100)+"%";
  for(let i=1;i<=count;i++){
    const r=h("div",{class:"pc "+color});r.style.flex=len+" 1 0%";
    if(o.cells)for(let k=0;k<len;k++)r.append(h("i"));
    if(o.labels)r.append(h("span",{text:len*i}));
    row.append(r);
  }
  return row;
}
function rodsModel(a,b,na,nb,cap,o){
  return h("div",{class:"model"},
    h("div",null,h("div",{class:"rl"},h("b",{text:"Regletas rojas de "+a}),h("span",{text:na+" × "+a+" = "+na*a})),rodRow(a,na,"a",cap,o)),
    h("div",null,h("div",{class:"rl"},h("b",{text:"Regletas azules de "+b}),h("span",{text:nb+" × "+b+" = "+nb*b})),rodRow(b,nb,"b",cap,o)));
}
/* bar split into n equal parts, each labelled */
function partsBar(name,total,n,label,color,maxT,unit){
  const bar=h("div",{class:"pbar"});bar.style.width=(total/maxT*100)+"%";
  for(let i=0;i<n;i++)bar.append(h("div",{class:"pp "+color,text:label}));
  return h("div",null,h("div",{class:"rl"},h("b",{text:name}),h("span",{text:total+(unit?" "+unit:"")})),bar);
}

/* ---------- hints and explanations ---------- */
const hintMCD=(a,b)=>h("div",{class:"hint"},line("Divisores de "+a+": "+divs(a).join(", ")),line("Divisores de "+b+": "+divs(b).join(", ")),line("Busca el mayor que está en las dos listas."));
const hintMCM=(a,b)=>{const l=lcm(a,b);return h("div",{class:"hint"},
  line("Múltiplos de "+a+": "+mults(a,l/a+1).join(", ")),line("Múltiplos de "+b+": "+mults(b,l/b+1).join(", ")),line("Busca el primer número que está en las dos listas."));};
const explMCD=(a,b)=>{const g=gcd(a,b),c=divs(g);return h("div",null,
  line("Divisores de "+a+": "+divs(a).join(", ")),line("Divisores de "+b+": "+divs(b).join(", ")),
  line("Divisores comunes: "+c.join(", ")+". El mayor: "+g+"."));};
const explMCM=(a,b)=>{const l=lcm(a,b);return h("div",null,
  line("Múltiplos de "+a+": "+mults(a,l/a).join(", ")+"…"),line("Múltiplos de "+b+": "+mults(b,l/b).join(", ")+"…"),
  line("El primero que está en las dos listas: "+l+"."));};
function explFactors(a,b,kind){
  const fa=factor(a),fb=factor(b);
  const ps=(kind==="mcd"?Object.keys(fa).filter(p=>fb[p]):uniq(Object.keys(fa).concat(Object.keys(fb)))).map(Number).sort((x,y)=>x-y);
  const f={};ps.forEach(p=>{f[p]=kind==="mcd"?Math.min(fa[p],fb[p]):Math.max(fa[p]||0,fb[p]||0);});
  return h("div",null,line(a+" = "+fmtF(fa)),line(b+" = "+fmtF(fb)),
    line((kind==="mcd"?"Factores comunes con el menor exponente: ":"Todos los factores con el mayor exponente: ")+fmtF(f)+" = "+prodF(f)));
}

/* ---------- question builders ---------- */
const choiceQ=o=>Object.assign({type:"choice"},o,{options:shuffle(o.options)});
function numChoice(o,c,cands,okf){
  const f=x=>o.unit?x+" "+o.unit:String(x);
  return choiceQ(Object.assign({},o,{options:numOpts(c,cands,okf).map(f),correct:f(c)}));
}

/* 1 · concreto: cintas */
function qCintas(u){
  const [a,b]=fresh(u,()=>pairMCD(36,{dmin:2,dmax:9})),g=gcd(a,b);
  return{type:"cintas",label:"Concreto · Cintas",a,b,g,rev:"MCD("+a+", "+b+") = "+g,
    explain:()=>h("div",null,ribbons(a,b,g),line(a+" = "+a/g+" × "+g+" y "+b+" = "+b/g+" × "+g+". MCD("+a+", "+b+") = "+g+"."))};
}
/* 1 · concreto: torres de regletas */
function qTorres(u){
  const [a,b]=fresh(u,()=>pairMCM(30,2,9)),l=lcm(a,b);
  return{type:"torres",label:"Concreto · Regletas",a,b,l,rev:"MCM("+a+", "+b+") = "+l,
    explain:()=>h("div",null,rodsModel(a,b,l/a,l/b,l,{labels:true}),line(l/a+" × "+a+" = "+l+" y "+l/b+" × "+b+" = "+l+". MCM("+a+", "+b+") = "+l+"."))};
}
/* 2 · pictórico MCD */
function qPD1(u){
  const [a,b]=fresh(u,()=>pairMCD(36,{dmin:2,dmax:9})),g=gcd(a,b);
  const cands=divs(g).filter(x=>x!==g).concat([a/g,b/g],divs(a).filter(x=>b%x!==0));
  return numChoice({label:"Modelo de barras",unit:"cm",
    q:"Las dos cintas están cortadas en trozos iguales, del mayor tamaño posible. ¿Cuánto mide cada trozo?",
    model:()=>ribbons(a,b,g),

  if(kind==="order"){

  }

  num:{n:10,gens:[qN1,qN2,qN3,qN4,qN5]},
  fact:{n:8,gens:[qF1,qF2,qF3]},
  prob:{n:6,gens:[u=>qProb("mcd",u),u=>qProb("mcm",u)]},
  det:{n:8,gens:[qDet]},
  frases:{n:8,gens:[qFr]},
  mix:{n:12,gens:[qPD1,qPD2,qPD3,qPM1,qPM2,qN1,qN2,qN3,qN4,qF1,qF2,qF3,u=>qProb("mcd",u),u=>qProb("mcm",u),qDet,qFr,qFr,qN5]}
};
function buildRound(mode){
  const R=ROUND[mode],u=new Set(),qs=[];let bag=[];
  for(let i=0;i<R.n;i++){if(!bag.length)bag=shuffle(R.gens);qs.push(bag.pop()(u));}
  return{mode,qs,i:0,score:0,missed:[],answered:false};
}
let round=null;
const $app=document.getElementById("app");

/* ---------- menu ---------- */
function showMenu(){
  round=null;
  const m=(mode,icon,t,d)=>`<button class="mode" type="button" data-mode="${mode}"><span class="ico">${icon}</span><span><span class="t">${t}</span><span class="d">${d}</span></span></button>`;
  $app.innerHTML=`<a class="home" href="/">🏠 Home</a>
<header class="hero"><h1>MCM y MCD con barras</h1><p class="sub">Primero tocas, luego dibujas y al final calculas. Cada partida trae números nuevos.</p></header>
<h2 class="grp">Empieza aquí</h2>
${m("learn","📖","Cómo funciona","El MCD y el MCM explicados con barras")}
<h2 class="grp">1 · Concreto: toca y mueve</h2>
${m("cintas","🎀","Cintas","Corta dos cintas en trozos iguales, lo más largos posible (MCD)")}
${m("torres","🧱","Regletas","Construye dos filas que midan lo mismo con pocas regletas (MCM)")}
<h2 class="grp">2 · Pictórico: mira el modelo de barras</h2>
${m("pdib","📊","Barras del MCD","Trozos, cortes y lo que sobra")}
${m("pmcm","📏","Barras del MCM","Filas de regletas que se encuentran")}
<h2 class="grp">3 · Abstracto: calcula con números</h2>
${m("num","🔢","Números","Divisores, múltiplos, MCD y MCM")}
${m("fact","🧮","Factores primos","Descomponer y calcular con exponentes")}
<h2 class="grp">Problemas</h2>
${m("prob","📝","Problemas con barras","Cintas, baldosas, autobuses y más")}
${m("det","🕵️","¿MCD o MCM?","Decide qué hay que calcular")}
<h2 class="grp">Frases para recordar</h2>
${m("frases","🧩","Frases clave","Ordena, rellena y elige la frase exacta")}
<h2 class="grp">Todo junto</h2>
${m("mix","🏆","Mezcla","12 preguntas de todo tipo")}`;
  $app.querySelectorAll("[data-mode]").forEach(b=>{b.onclick=()=>start(b.dataset.mode);});
  window.scrollTo(0,0);
}
function start(mode){
  if(mode==="learn")return showLearn();
  round=buildRound(mode);showQ();
}

/* ---------- question screen ---------- */
function showQ(){
  const r=round,q=r.qs[r.i];r.answered=false;
  const star=h("span",{class:"score",text:"⭐ "+r.score});
  const bar=h("div",{class:"bar"});bar.style.width=(r.i/r.qs.length*100)+"%";
  const top=h("div",{class:"top"},
    h("button",{class:"back",type:"button",text:"← Menú",onclick:showMenu}),
    h("div",{class:"prog","aria-hidden":"true"},bar),
    h("span",{class:"count",text:(r.i+1)+" / "+r.qs.length}),star);
  const card=h("section",{class:"card"});
  const fb=h("div",{role:"status","aria-live":"polite"});
  const finish=(ok,info)=>{
    info=info||{};
    if(r.answered)return;r.answered=true;
    if(ok&&!info.hint&&!info.noStar){r.score++;star.textContent="⭐ "+r.score;}
    if(!ok||info.noStar)r.missed.push(q.rev);
    const last=r.i===r.qs.length-1;
    const title=info.title||(ok?(info.hint?"Bien, pero has usado la pista: sin estrella.":"¡Correcto! ⭐"):"No era esa.");
    const box=h("div",{class:"fb "+(ok?"good":"bad")},
      h("strong",{text:title}),
      (!ok&&info.answer!=null)?h("div",{class:"ans"},"La respuesta: ",h("b",{text:String(info.answer)})):null,
      q.explain?h("div",{class:"exp"},h("span",{class:"lab",text:"Así se ve"}),q.explain()):null,
      (q.rev&&q.revLabel)?h("div",{class:"src"},h("span",{class:"lab",text:q.revLabel||"Recuerda"}),h("span",{text:q.rev})):null,
      h("button",{class:"btn",type:"button",text:last?"Ver resultados":"Siguiente →",onclick:()=>{r.i++;if(last)showResults();else showQ();}}));
    fb.replaceChildren(box);
    box.scrollIntoView({block:"nearest"});
  };
  ({choice:rChoice,num:rNum,gap:rGap,order:rOrder,cintas:rCintas,torres:rTorres})[q.type](q,finish,card);
  $app.replaceChildren(top,card,fb);
  window.scrollTo(0,0);
  const first=card.querySelector("input");if(first)first.focus({preventScroll:true});
}
const head=q=>[h("div",{class:"qtype",text:q.label}),q.lead?h("p",{class:"lead",text:q.lead}):null];
function hintButton(q,card,state){
  if(!q.hint)return null;
  const b=h("button",{class:"btn ghost",type:"button",text:"Pista"});
  b.onclick=()=>{if(state.hinted)return;state.hinted=true;b.disabled=true;card.append(q.hint());};
  return b;
}

function rChoice(q,finish,card){
  const st={hinted:false},list=h("div",{class:"opts"});
  q.options.forEach(o=>{
    const b=h("button",{class:"opt",type:"button",text:o});
    b.onclick=()=>{
      [...list.children].forEach(x=>{x.disabled=true;if(x.textContent===q.correct)x.classList.add("good");});
      if(o!==q.correct)b.classList.add("bad");
      finish(o===q.correct,{hint:st.hinted});
    };
    list.append(b);
  });
  add(card,head(q),q.problem?h("p",{class:"prob",text:q.problem}):null,h("p",{class:"q",text:q.q}),q.model?q.model():null,list);
  const hb=hintButton(q,card,st);if(hb)add(card,h("div",{class:"actions"},hb));
}
function rNum(q,finish,card){
  const st={hinted:false};
  add(card,head(q),h("p",{class:"q",text:q.q}),q.model?q.model():null);
  const inp=h("input",{class:"txt",id:"num-answer",type:"text",inputmode:"numeric",autocomplete:"off",placeholder:q.unit?"Escribe el número ("+q.unit+")":"Escribe el número","aria-label":"Respuesta"});
  const check=h("button",{class:"btn",type:"button",text:"Comprobar"});
  const hb=hintButton(q,card,st);
  const submit=()=>{
    const v=parseInt(inp.value.trim(),10);
    if(isNaN(v)){inp.focus();return;}
    const ok=v===q.answer;inp.disabled=true;check.disabled=true;if(hb)hb.disabled=true;
    inp.classList.add(ok?"good":"bad");
    finish(ok,{hint:st.hinted,answer:q.answer+(q.unit?" "+q.unit:"")});
  };
  check.onclick=submit;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  add(card,inp,h("div",{class:"actions"},hb,check));
}
function rGap(q,finish,card){
  add(card,head(q),h("p",{class:"q sentence"},q.before,h("span",{class:"blank"}),q.after),
    h("p",{class:"note",text:"Escribe las palabras que faltan tal como son. Se admite sin tildes."}));
  const inp=h("input",{class:"txt",id:"gap-answer",type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"Palabras que faltan","aria-label":"Palabras que faltan"});
  const note=h("p",{class:"note"});
  const hintBtn=h("button",{class:"btn ghost",type:"button",text:"Pista"});
  const check=h("button",{class:"btn",type:"button",text:"Comprobar"});
  let hinted=false;
  hintBtn.onclick=()=>{hinted=true;const w=q.answer,words=w.split(" ").length;
    note.textContent="Empieza por «"+w[0]+"». "+words+(words===1?" palabra":" palabras")+", "+w.replace(/[^A-Za-zÁÉÍÓÚáéíóúñÑ0-9]/g,"").length+" letras.";inp.focus();};
  const submit=()=>{
    const v=norm(inp.value);if(!v){inp.focus();return;}
    const ok=v===norm(q.answer);
    inp.disabled=true;check.disabled=true;hintBtn.disabled=true;inp.classList.add(ok?"good":"bad");
    const bl=card.querySelector(".blank");bl.textContent=q.answer;bl.classList.add(ok?"good":"bad");
    finish(ok,{hint:hinted,answer:q.answer});
  };
  check.onclick=submit;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  add(card,inp,note,h("div",{class:"actions"},hintBtn,check));
}
function rOrder(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Toca los trozos en el orden correcto para formar la frase."}));
  let ans=[],bank=q.parts.slice(),locked=false;
  const slot=h("div",{class:"slot"}),bankEl=h("div",{class:"bank"});
  const check=h("button",{class:"btn",type:"button",text:"Comprobar"});
  const reset=h("button",{class:"btn ghost",type:"button",text:"Empezar otra vez"});
  const chip=(c,fn,cls)=>h("button",{class:"chip"+(cls?" "+cls:""),type:"button",text:c.t,disabled:locked,onclick:fn});
  function draw(cls){
    slot.className="slot"+(cls?" "+cls:"");
    slot.replaceChildren(...(ans.length?ans.map(c=>chip(c,()=>{ans=ans.filter(x=>x!==c);bank.push(c);draw();},"in")):[h("span",{class:"ph",text:"Tu frase va aquí"})]));
    bankEl.replaceChildren(...bank.map(c=>chip(c,()=>{bank=bank.filter(x=>x!==c);ans.push(c);draw();})));
    check.disabled=locked||ans.length!==q.parts.length;reset.disabled=locked||!ans.length;
  }
  check.onclick=()=>{const ok=ans.map(c=>c.t).join(" ")===q.target;locked=true;draw(ok?"good":"bad");finish(ok);};
  reset.onclick=()=>{bank=q.parts.slice();ans=[];draw();};
  add(card,slot,bankEl,h("div",{class:"actions"},reset,check));
  draw();
}

/* concreto: cintas — choose the piece length, see what is left over */
function rCintas(q,finish,card){
  const {a,b,g}=q,top=Math.min(a,b);let L=1,wrong=0,locked=false;
  add(card,head(q),h("p",{class:"q",text:"Corta las dos cintas en trozos iguales. Busca el trozo más grande que no deja sobrar nada en ninguna cinta."}));
  const view=h("div"),sums=h("div"),val=h("div",{class:"stepval"}),note=h("p",{class:"note"});
  const minus=h("button",{class:"btn ghost",type:"button",text:"−","aria-label":"Trozo más corto"});
  const plus=h("button",{class:"btn ghost",type:"button",text:"+","aria-label":"Trozo más largo"});
  const ok=h("button",{class:"btn",type:"button",text:"Este es el trozo más grande que no deja sobrar"});
  const sum=(name,t)=>{const n=Math.floor(t/L),r=t%L;return h("p",{class:"sumline",text:name+": "+n+(n===1?" trozo":" trozos")+" de "+L+" cm"+(r?" y sobran "+r+" cm.":". No sobra nada ✔")});};
  function draw(){
    view.replaceChildren(ribbons(a,b,L));
    sums.replaceChildren(sum("Cinta roja",a),sum("Cinta azul",b));
    val.textContent=L+" cm";minus.disabled=locked||L<=1;plus.disabled=locked||L>=top;ok.disabled=locked;
  }
  minus.onclick=()=>{L--;note.textContent="";note.className="note";draw();};
  plus.onclick=()=>{L++;note.textContent="";note.className="note";draw();};
  ok.onclick=()=>{
    if(a%L||b%L){wrong++;note.className="note bad";note.textContent="Con trozos de "+L+" cm sobra cinta. Prueba otro tamaño.";}
    else if(L<g){wrong++;note.className="note bad";note.textContent="Con "+L+" cm no sobra nada, pero se pueden cortar trozos más grandes.";}
    else{locked=true;draw();finish(wrong===0,{title:wrong===0?"¡Lo has encontrado a la primera! ⭐":"¡Encontrado! Con intentos de más no hay estrella.",noStar:wrong>0});}
  };
  add(card,view,h("div",{class:"stepper"},minus,val,plus),sums,note,h("div",{class:"actions"},ok));
  draw();
}
/* concreto: regletas — build two rows until they are equal */
function rTorres(q,finish,card){
  const {a,b,l}=q,cap=l+Math.max(a,b);let na=0,nb=0,wrong=0,locked=false;
  add(card,head(q),h("p",{class:"q",text:"Añade regletas a cada fila hasta que las dos midan lo mismo. Busca la longitud más corta posible."}));
  const mk=(len,color,name)=>{
    const track=h("div",{class:"track"});track.style.setProperty("--cap",cap);
    const tot=h("span",{class:"tot"});
    const minus=h("button",{class:"sq",type:"button",text:"−","aria-label":"Quitar una regleta de "+len});
    const plus=h("button",{class:"sq plus",type:"button",text:"+","aria-label":"Añadir una regleta de "+len});
    const wrap=h("div",{class:"tower"},h("div",{class:"tctl"},h("span",{class:"name",text:name+" de "+len}),minus,plus,tot),track);
    return{len,color,track,tot,minus,plus,wrap};
  };
  const A=mk(a,"a","Regletas rojas"),B=mk(b,"b","Regletas azules");
  const note=h("p",{class:"note"});
  const ok=h("button",{class:"btn",type:"button",text:"Son iguales y es la más corta"});
  function draw(){
    [[A,na],[B,nb]].forEach(([T,n])=>{
      T.track.replaceChildren(rodRow(T.len,n,T.color,cap,{cells:true}));
      T.tot.textContent=n+" × "+T.len+" = "+n*T.len;
      T.minus.disabled=locked||n===0;T.plus.disabled=locked||(n+1)*T.len>cap;
    });
    const eq=na*a>0&&na*a===nb*b;
    A.track.classList.toggle("eq",eq);B.track.classList.toggle("eq",eq);
    ok.disabled=locked||!eq;
  }
  A.minus.onclick=()=>{na--;note.textContent="";draw();};A.plus.onclick=()=>{na++;note.textContent="";draw();};
  B.minus.onclick=()=>{nb--;note.textContent="";draw();};B.plus.onclick=()=>{nb++;note.textContent="";draw();};
  ok.onclick=()=>{
    if(na*a!==l){wrong++;note.className="note bad";note.textContent="Las filas son iguales, pero hay una longitud más corta. Quita regletas y prueba otra vez.";}
    else{locked=true;draw();finish(wrong===0,{title:wrong===0?"¡Lo has encontrado a la primera! ⭐":"¡Encontrado! Con intentos de más no hay estrella.",noStar:wrong>0});}
  };
  add(card,A.wrap,B.wrap,h("p",{class:"note",text:"Truco: añade una regleta a la fila que va más corta."}),note,h("div",{class:"actions"},ok));
  draw();
}

/* ---------- results and learn ---------- */
function showResults(){
  const r=round,n=r.qs.length,s=r.score,missed=uniq(r.missed);
  const msg=s===n?"¡Perfecto! Todas.":s/n>=.7?"¡Muy bien!":s/n>=.4?"Buen intento. Otra partida te ayudará.":"Sigue practicando. Mira «Cómo funciona» y vuelve a probar.";
  $app.replaceChildren(...[
    h("section",{class:"card"},h("div",{class:"qtype",text:"Partida terminada"}),h("p",{class:"big",text:s+" / "+n}),h("p",{class:"q",text:msg})),
    missed.length?h("section",{class:"card"},h("div",{class:"qtype",text:"Para repasar"}),...missed.map(t=>h("p",{class:"rev",text:t}))):null,
    h("div",{class:"actions"},
      h("button",{class:"btn",type:"button",text:"Jugar otra vez",onclick:()=>start(r.mode)}),
      h("button",{class:"btn ghost",type:"button",text:"Menú",onclick:showMenu}))
  ].filter(Boolean));
  window.scrollTo(0,0);
}
function showLearn(){
  const top=h("div",{class:"top"},h("button",{class:"back",type:"button",text:"← Menú",onclick:showMenu}));
  const c1=h("section",{class:"card read"},h("h2",{text:"Tres pasos: toca, dibuja, calcula"}),
    h("p",{text:"1 · Concreto: mueves cintas y regletas con los dedos."}),
    h("p",{text:"2 · Pictórico: dibujas el problema con barras."}),
    h("p",{text:"3 · Abstracto: lo resuelves solo con números."}));
  const c2=h("section",{class:"card read"},h("h2",{text:"MCD: cortar en trozos iguales"}),
    ribbons(12,18,6),
    h("p",{text:"Las dos cintas se cortan en trozos iguales, lo más largos posible, sin que sobre nada."}),
    h("p",{text:"12 = 2 trozos de 6 y 18 = 3 trozos de 6. Con 2 y 3 trozos ya no se puede cortar más grande."}),
    h("p",{class:"big-eq",text:"MCD(12, 18) = 6"}));
  const c3=h("section",{class:"card read"},h("h2",{text:"MCM: filas que se encuentran"}),
    rodsModel(4,6,3,2,12,{labels:true}),
    h("p",{text:"Una fila de regletas de 4 y otra de 6 empiezan juntas. Llegan a 4, 8, 12 y a 6, 12."}),
    h("p",{text:"Se encuentran por primera vez en 12."}),
    h("p",{class:"big-eq",text:"MCM(4, 6) = 12"}));
  const c4=h("section",{class:"card read"},h("h2",{text:"¿Cuál uso?"}),
    h("p",{text:"Si cortas o repartes en partes iguales, el resultado es más pequeño que tus números: MCD."}),
    h("p",{text:"Si algo se repite y quieres saber cuándo coincide, el resultado es mayor que tus números: MCM."}));
  const c5=h("section",{class:"card read"},h("h2",{text:"Con factores primos"}),
    h("p",{text:"12 = 2² · 3 y 18 = 2 · 3²"}),
    h("p",{text:"MCD: factores comunes con el menor exponente. 2 · 3 = 6."}),
    h("p",{text:"MCM: todos los factores con el mayor exponente. 2² · 3² = 36."}));
  $app.replaceChildren(top,c1,c2,c3,c4,c5,h("button",{class:"btn",type:"button",style:"width:100%",text:"Volver al menú",onclick:showMenu}));
  window.scrollTo(0,0);
}
showMenu();
</script>
