<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobby Quest</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#2b2b2b;--accent:#ea580c;--ok:#16a34a;--bad:#dc2626;--line:#fed7aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#2a1f18;--ink:#f5ece4;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--line:#4a3426}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#2a1f18;--ink:#f5ece4;--accent:#fb923c;--ok:#4ade80;--bad:#f87171;--line:#4a3426}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:16px}
h1{text-align:center;margin:8px 0}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px}
.q{font-size:1.25rem;font-weight:700;margin:6px 0 16px}
.tag{font-size:.8rem;color:var(--accent);font-weight:700;text-transform:uppercase}
button{font:inherit;width:100%;padding:14px;margin:6px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:1.05rem}
button:hover:not(:disabled){border-color:var(--accent)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
a.home{display:inline-block;font-weight:700;color:var(--accent);text-decoration:none;padding:6px 0}
a:focus-visible{outline:3px solid var(--accent)}
.tip{margin-top:10px;min-height:2.4em;font-size:.95rem}
.big{font-size:3rem;text-align:center}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
</style>
</head>
<body>
<main>
<a class="home" href="/">🏠 Home</a>
<h1>🎮 Hobby Quest</h1>
<div id="app"></div>
</main>
<script>
var Q=[
["Vocabulary","🎙️ You use a ___ to record a podcast.",["microphone","trampoline","bead"],0,"A microphone records your voice."],
["Vocabulary","Making necklaces with ___ is doing arts and crafts.",["beads","laptops","flowers"],0,"Beads = cuentas."],
["Vocabulary","Growing plants and flowers is ___.",["coding","gardening","podcasting"],1,"Gardening = jardinería."],
["Vocabulary","Writing instructions for a computer is ___.",["coding","trampolining","gardening"],0,"Coding = programar."],
["Vocabulary","Traffic lights need ___ to function.",["beads","code","a band"],1,"All these objects need code."],
["Vocabulary","You can ___ an app on a tablet.",["create","plant","bounce"],0,"Create an app = crear una app."],
["Gerund","She ___ playing basketball.",["love","loves","loving"],1,"She/He → verb + s."],
["Gerund","My sister ___ like doing sport at all.",["don’t","doesn’t","isn’t"],1,"She → doesn’t."],
["Gerund","They hate ___ and trampolining.",["garden","gardening","to garden"],1,"hate + verb-ing."],
["Gerund","I prefer coding ___ swimming.",["than","to","for"],1,"prefer … to …"],
["Gerund","He can’t stand ___ outside.",["be","being","to be"],1,"can’t stand + verb-ing."],
["Spelling","run → ___",["runing","running","runming"],1,"Irregular: run → running (double n)."],
["Spelling","code → ___",["codeing","codding","coding"],2,"code → coding (quitamos la e)."],
["Purpose","Graphic artists take photos ___ create images.",["to","for","at"],0,"Infinitive of purpose: to + verb."],
["Purpose","Pupils use tablets ___ learn.",["for","to","at"],1,"use + noun + to + verb."],
["Purpose","Cyclists wear helmets ___ protect their heads.",["to","by","in"],0,"to protect = para proteger."],
["Questions","___ she use headphones to listen to podcasts?",["Do","Does","Is"],1,"She → Does."],
["Questions","Do they take photos? No, they ___.",["doesn’t","don’t","aren’t"],1,"They → don’t."],
["Questions","Does he use a camera? Yes, he ___.",["do","does","is"],1,"He → does."],
["Questions","___ you take photos to create images?",["Do","Does","Are"],0,"You → Do."],
["Mix","My brother loves ___ in a band.",["play","playing","to playing"],1,"loves + verb-ing."],
["Mix","We really enjoy ___ with a microphone.",["sing","singing","sings"],1,"enjoy + verb-ing."],
["Mix","She prefers ___ to doing arts and crafts. She loves plants and flowers.",["gardening","garden","gardens"],0,"prefers + verb-ing + to + verb-ing."],
["Mix","My cousin ___ podcasting. He loves it!",["enjoy","enjoys","enjoying"],1,"He → enjoys."],
["Mix","I ___ stand trampolining. It’s too scary!",["can’t","doesn’t","don’t can"],0,"can’t stand + verb-ing."],
["Mix","Our friends can’t stand ___ with beads.",["make","making","to make"],1,"can’t stand + verb-ing."],
["Mix","He doesn’t like ___ a website. It’s difficult.",["design","designing","designs"],1,"doesn’t like + verb-ing."],
["Mix","They love ___ an app on the laptop.",["create","creating","creates"],1,"create → creating (quitamos la e)."],
["Mix","My sister hates ___ a computer. She prefers drawing.",["programming","programing","program"],0,"program → programming (doble m)."],
["Mix","I like ___ a laptop to code.",["use","using","uses"],1,"like + verb-ing; use → using."],
["Mix","We prefer ___ the interactive whiteboard to ___ paper.",["using / using","use / using","using / use"],0,"prefer + verb-ing to + verb-ing."],
["Mix","Does your brother enjoy ___ in a band?",["play","playing","plays"],1,"enjoy + verb-ing."],
["Mix","They ___ gardening. They think it’s boring.",["doesn’t like","don’t like","doesn’t likes"],1,"They → don’t like."],
["Mix","My dad ___ coding to gardening.",["prefer","prefers","prefering"],1,"My dad = he → prefers."],
["Mix","Mia ___ doing arts and crafts with beads.",["love","loves","loving"],1,"Mia = she → loves."],
["Purpose","I use a laptop ___ code.",["to","for","at"],0,"use + noun + to + verb."],
["Purpose","We use a microphone ___ record a podcast.",["to","for","in"],0,"to record = para grabar."],
["Purpose","People use the smart TV ___ watch videos.",["to","for","at"],0,"to watch = para ver."],
["Purpose","Teachers use an interactive whiteboard ___ teach.",["to","for","by"],0,"to teach = para enseñar."],
["Purpose","I need a pencil ___ draw pictures.",["to","for","of"],0,"to draw = para dibujar."],
["Purpose","She uses her laptop ___ design a website.",["to","for","at"],0,"to design = para diseñar."],
["Purpose","Programmers write code ___ create apps.",["to","for","at"],0,"to create = para crear."],
["Purpose","Drivers need traffic lights ___ stop and go safely.",["to","for","at"],0,"Infinitive of purpose: to + verb."],
["Purpose","He wears headphones ___ listen to podcasts.",["to","for","at"],0,"to listen to = para escuchar."],
["Purpose","We use a camera ___ take photos.",["to","for","by"],0,"to take = para hacer (fotos)."],
["Purpose","She takes her phone ___ create images.",["to","for","at"],0,"to create = para crear."],
["Purpose","My friend uses beads ___ make bracelets.",["to","for","at"],0,"to make = para hacer."],
["Questions","___ your sister use a laptop to design websites?",["Do","Does","Is"],1,"Your sister = she → Does."],
["Questions","___ they use headphones to listen to podcasts?",["Do","Does","Are"],0,"They → Do."],
["Questions","___ he use a tablet to learn?",["Do","Does","Is"],1,"He → Does."],
["Questions","Does she use a pencil to draw? No, she ___.",["don’t","doesn’t","isn’t"],1,"She → doesn’t."],
["Questions","Do you use a microphone to sing? Yes, I ___.",["do","does","am"],0,"I → do."],
["Questions","Do your friends use code to create apps? Yes, they ___.",["do","does","are"],0,"They → do."],
["Questions","Does your brother use a laptop to play in a band? No, he ___.",["don’t","doesn’t","isn’t"],1,"He → doesn’t."],
["Questions","What ___ you use to take photos?",["do","does","are"],0,"What do you use…?"],
["Questions","What ___ she use to listen to podcasts?",["do","does","is"],1,"What does she use…?"],
["Questions","Do you love ___ plants and flowers?",["grow","growing","to growing"],1,"love + verb-ing."],
["Questions","Does he like ___ the smart TV?",["use","using","uses"],1,"like + verb-ing."],
["Vocabulary","The ___ lights help cars stop and go.",["traffic","smart","coding"],0,"Traffic lights = semáforos."],
["Vocabulary","A ___ TV can connect to the internet.",["smart","traffic","bead"],0,"Smart TV."],
["Vocabulary","Teachers write on an interactive ___ in the classroom.",["whiteboard","microphone","trampoline"],0,"Interactive whiteboard = pizarra digital."],
["Vocabulary","To ___ a website you need a computer and ideas.",["design","bounce","plant"],0,"design a website."],
["Vocabulary","Jumping on a trampoline is called ___.",["trampolining","podcasting","gardening"],0,"trampolining."],
["Vocabulary","Recording shows to share online is ___.",["podcasting","gardening","trampolining"],0,"podcasting."],
["Vocabulary","A guitarist and a drummer are playing in a ___.",["band","bead","code"],0,"playing in a band."],
["Vocabulary","I use a ___ to program a computer.",["laptop","bead","flower"],0,"laptop = portátil."],
["Spelling","swim → ___",["swiming","swimming","swimmeing"],1,"swim → swimming (doble m)."],
["Spelling","make → ___",["makeing","making","makking"],1,"make → making."],
["Spelling","use → ___",["useing","using","usseing"],1,"use → using."],
["Spelling","sing → ___",["singing","singging","sing"],0,"sing → singing."],
["Spelling","podcast → ___",["podcasting","podcastting","podcasing"],0,"podcast → podcasting."],
["Spelling","plan → ___",["planing","planning","planeing"],1,"plan → planning (doble n)."],
["Spelling","design → ___",["designning","designing","desiging"],1,"design → designing."],
["Spelling","create → ___",["createing","creating","creatting"],1,"create → creating."]
];
var app=document.getElementById("app"),qs,i,score,lives,streak,locked;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){qs=shuffle(Q).slice(0,12);i=0;score=0;lives=3;streak=0;show()}
function home(){app.innerHTML='<div class="card"><div class="big">🎸🪴💻</div><p style="text-align:center">12 questions on hobbies, <b>verb + -ing</b>, <b>to + verb</b> and tech vocabulary.<br>You have 3 lives ❤️❤️❤️</p><button class="main" onclick="start()">Play!</button></div>'}
function show(){
 if(i>=qs.length||lives<=0)return end();
 var q=qs[i];locked=false;
 var opts=shuffle(q[2].map(function(t,n){return{t:t,c:n===q[3]}}));
 var h='<div class="bar"><span>⭐ '+score+'</span><span>🔥 '+streak+'</span><span>'+"❤️".repeat(lives)+'</span></div><div class="prog"><div style="width:'+(i/qs.length*100)+'%"></div></div><div class="card"><div class="tag">'+q[0]+'</div><div class="q">'+q[1]+'</div>';
 opts.forEach(function(o,n){h+='<button data-c="'+(o.c?1:0)+'" onclick="pick(this)">'+o.t+'</button>'});
 h+='<div class="tip" id="tip"></div></div>';
 app.innerHTML=h;
}
function pick(b){
 if(locked)return;locked=true;
 var ok=b.dataset.c==="1",q=qs[i];
 document.querySelectorAll("button").forEach(function(x){x.disabled=true;if(x.dataset.c==="1")x.classList.add("ok")});
 if(ok){score+=10+streak*2;streak++;document.getElementById("tip").textContent="✅ Great! "+q[4]}
 else{b.classList.add("bad");lives--;streak=0;document.getElementById("tip").textContent="❌ "+q[4]}
 var n=document.createElement("button");n.className="main";n.textContent="Next ➜";n.onclick=function(){i++;show()};
 document.querySelector(".card").appendChild(n);
}
function end(){
 var won=lives>0,s=score>=120?"🏆 Champion!":score>=70?"🎉 Very good!":"💪 Keep practising!";
 app.innerHTML='<div class="card"><div class="big">'+(won?"🏆":"😅")+'</div><p style="text-align:center;font-size:1.2rem"><b>'+s+'</b><br>Score: '+score+'</p><button class="main" onclick="start()">Play again</button></div>';
}
home();
</script>
</body>
</html>
