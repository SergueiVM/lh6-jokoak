<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arnasketa prozesua: jokoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of rounded cards with big buttons, same look as the other LH6 study games */
:root{--bg:#fff4e0;--card:#fff;--ink:#2b2350;--pri:#ff6b4a;--ok:#1f9d63;--bad:#d6334f;--sec:#5b4bdb;--line:#e8d9bd;--okbg:#e3f5ec;--badbg:#fde6ea;--link:#5b4bdb;--soft:#f7ecd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--okbg:#17402f;--badbg:#4a1f2e;--link:#b9afff;--soft:#352c63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--okbg:#17402f;--badbg:#4a1f2e;--link:#b9afff;--soft:#352c63;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px;text-wrap:balance}
h2{font-size:18px;margin:18px 0 4px;color:var(--sec)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:#b9afff}}
:root[data-theme="dark"] h2{color:#b9afff}
p{margin:6px 0}
a.home{display:inline-block;color:var(--link);font-weight:700;text-decoration:none;padding:6px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;font-weight:700;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;margin:6px 0;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sec)}
button.big{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-size:19px}
button.alt{background:var(--sec);color:#fff;border-color:var(--sec)}
button.ghost{width:auto;text-align:center;font-size:15px;padding:6px 12px;min-height:36px}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{cursor:default;opacity:.55}
button.ok:disabled,button.bad:disabled{opacity:1}
.rc{float:right;font-weight:600;opacity:.9;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:20px;font-weight:700;margin:0 0 8px}
.clue{background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:19px}
.fb{min-height:24px;font-weight:700;margin:8px 0}
.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.opt.long{font-size:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{width:auto;max-width:100%;text-align:center;margin:0}
.slot{border:2px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot button{width:auto;max-width:100%;margin:0;background:var(--soft)}
.ord{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ord div{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700}
.ord div.f{border-style:solid;border-color:var(--ok);background:var(--okbg)}
input.txt{font:inherit;font-weight:700;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
.blank{display:inline-block;min-width:90px;border-bottom:3px dotted var(--pri);text-align:center;color:var(--pri);font-weight:800}
.big-n{font-size:48px;font-weight:800;text-align:center}
.fig{position:relative;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:8px auto;line-height:0;max-width:420px}
.fig img{display:block;width:100%;height:auto}
.cv{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--sec);color:#fff;font-weight:800;border-radius:5px;line-height:1.05;font-size:clamp(12px,3.8vw,18px);border:1px solid #fff;overflow:hidden}
.cv.on{background:var(--pri);animation:pulse 1.1s ease-in-out infinite}
.cv.shown{background:var(--ok);font-size:clamp(8px,2.4vw,11px)}
@keyframes pulse{50%{transform:scale(1.1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.cv.on,.shake{animation:none}}
.ficha p{margin:8px 0}
.ficha b{color:var(--pri)}
.miss p{margin:6px 0;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:16px}
</style>

function distract(s){
 let out=[];
 for(const [a,b] of sh(s.w)){const v=s.t.replace(a,b);if(v!==s.t&&!out.includes(v))out.push(v)}
 out=out.slice(0,3);

 while(out.length<3&&tries++<60&&w.length>3){
  const j=Math.floor(Math.random()*(w.length-2)),v=w.slice();
  if(Math.random()<.5){[v[j],v[j+1]]=[v[j+1],v[j]]}else v.splice(j,1);
  const t=v.join(" ");if(t!==s.t&&!out.includes(t))out.push(t);
 }
 return out;
}

 $("pool").onclick=e=>{
  const b=e.target.closest("button");if(!b||lock)return;
