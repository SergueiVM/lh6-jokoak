<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arnas aparatua: jokoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of rounded cards with big buttons, same look as the other LH6 study games */
:root{--bg:#fff4e0;--card:#fff;--ink:#2b2350;--pri:#ff6b4a;--ok:#1f9d63;--bad:#d6334f;--sec:#5b4bdb;--line:#e8d9bd;--okbg:#e3f5ec;--badbg:#fde6ea;--link:#5b4bdb;--soft:#f7ecd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--okbg:#17402f;--badbg:#4a1f2e;--link:#b9afff;--soft:#352c63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--okbg:#17402f;--badbg:#4a1f2e;--link:#b9afff;--soft:#352c63;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px;text-wrap:balance}
h2{font-size:18px;margin:18px 0 4px;color:var(--sec)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:#b9afff}}
:root[data-theme="dark"] h2{color:#b9afff}
p{margin:6px 0}
a.home{display:inline-block;color:var(--link);font-weight:700;text-decoration:none;padding:6px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;font-weight:700;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;margin:6px 0;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sec)}
button.big{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-size:19px}
button.alt{background:var(--sec);color:#fff;border-color:var(--sec)}
button.ghost{width:auto;text-align:center;font-size:15px;padding:6px 12px;min-height:36px}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{cursor:default;opacity:.55}
button.ok:disabled,button.bad:disabled{opacity:1}
.rc{float:right;font-weight:600;opacity:.85;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:20px;font-weight:700;margin:0 0 8px}
.clue{background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:19px}
.fb{min-height:24px;font-weight:700;margin:8px 0}
.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.opt.long{font-size:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{width:auto;text-align:center;margin:0}
.slot{border:2px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot button{width:auto;margin:0;background:var(--soft)}
.ord{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ord div{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700}
.ord div.f{border-style:solid;border-color:var(--ok);background:var(--okbg)}
input.txt{font:inherit;font-weight:700;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
.blank{display:inline-block;min-width:90px;border-bottom:3px dotted var(--pri);text-align:center;color:var(--pri);font-weight:800}
.big-n{font-size:48px;font-weight:800;text-align:center}
.fig{position:relative;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0;line-height:0}
.fig img{display:block;width:100%;height:auto}
.cv{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--sec);color:#fff;font-weight:800;border-radius:5px;line-height:1;font-size:clamp(12px,3.6vw,19px);border:1px solid #fff}
.cv.on{background:var(--pri);animation:pulse 1.1s ease-in-out infinite}
.cv.shown{background:var(--ok);font-size:clamp(8px,2.3vw,12px)}
@keyframes pulse{50%{transform:scale(1.12)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.cv.on,.shake{animation:none}}
.ficha p{margin:8px 0}
.ficha b{color:var(--pri)}
.miss p{margin:6px 0;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:16px}
</style>

function distract(s){
 let out=[];
 for(const [a,b] of sh(s.w)){const v=s.t.replace(a,b);if(v!==s.t&&!out.includes(v))out.push(v)}
 out=out.slice(0,3);
 const w=s.t.split(" ");let tries=0;
 while(out.length<3&&tries++<60&&w.length>3){
  const j=Math.floor(Math.random()*(w.length-2)),v=w.slice();
  if(Math.random()<.5){[v[j],v[j+1]]=[v[j+1],v[j]]}else v.splice(j,1);
  const t=v.join(" ");if(t!==s.t&&!out.includes(t))out.push(t);
 }
 return out;
}

 }
 if(sp.t==="tfo"){
  const o=ORG[sp.oi],c=o.c[sp.ci],rev=`${o.n}: ${c.x}.`;

 }
 if(sp.t==="tfs"){
  const s=SEN[sp.si];
  if(sp.v)return {type:"tf",stmt:s.t,v:1,rev:s.t};

 }

 }

 const html=esc(q.text).replace("\u0000",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
 let hint=false;
 app.innerHTML=head()+`<div class="card"><p class="q">Idatzi falta dena.</p><div class="clue">${html}</div><input class="txt" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Idatzi hemen…"><div class="fb" id="fb"></div><button class="big" id="chk">Egiaztatu</button><button class="ghost" id="hb">💡 Pista (−5 puntu)</button>${nextBtn()}</div>`;
 const chk=()=>{
  if(lock)return;
  const v=$("ans").value;if(!norm(v))return;
  const ok=norm(v)===norm(q.ans);
  $("ans").disabled=true;$("chk").hidden=true;$("hb").hidden=true;
  finish(ok,ok?(hint?5:10):0,q.rev,ok?"Zuzena! 🎉":`Ez da hori. Zuzena: ${esc(q.ans)}<br><span style="font-weight:600">${esc(q.full)}</span>`);
 };
 $("chk").onclick=chk;
 $("ans").onkeydown=e=>{if(e.key==="Enter")chk()};
 $("hb").onclick=()=>{hint=true;const f=$("fb");f.className="fb";f.textContent=`Pista: ${q.ans.charAt(0)}… (${q.ans.replace(/\s/g,"").length} letra)`;$("hb").hidden=true;$("ans").focus()};
}
function rOrder(q){
 let nx=0,err=0;
 const items=sh(PATH.slice());
 app.innerHTML=head()+`<div class="card"><p class="q">Airearen bidaia: sudurretik bronkioetara. Sakatu arnasbideak ordenan.</p><div class="ord" id="ord">${PATH.map((_,i)=>`<div id="o${i}">${i+1}.</div>`).join("")}</div><div class="chips" id="pool">${items.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div><div class="fb" id="fb"></div>${nextBtn()}</div>`;
 $("pool").onclick=e=>{
  const b=e.target.closest("button");if(!b||lock)return;
  if(b.dataset.n===PATH[nx]){
   const d=$("o"+nx);d.textContent=(nx+1)+". "+PATH[nx];d.className="f";b.hidden=true;nx++;
   if(nx===PATH.length){const pts=Math.max(2,10-3*err);finish(err===0,pts,q.rev,err===0?"Zuzena! 🎉":`Bukatu duzu, baina ${err} akats egin dituzu. Bidea: ${esc(PATH.join(" → "))}`)}
  }else{err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}
 };
}
function end(){
 const max=S.qs.length*10,pct=S.score/max;
 if(S.score>rec(S.mode))ls("best_"+S.mode,S.score);
 const m=pct>=.8?"Bikain! Maisua zara! 🏆":pct>=.5?"Oso ondo! Errepasatu pixka bat 👍":"Saiatu berriro, lortuko duzu! 💪";
 const miss=S.miss.length?`<div class="card miss"><p class="q">Errepasatu:</p>${S.miss.map(r=>`<p>${esc(r)}</p>`).join("")}</div>`:"";
 app.innerHTML=`<div class="card"><div class="big-n">${S.score}<span style="font-size:22px"> / ${max}</span></div><p style="text-align:center" class="q">${m}</p>
 <button class="big" onclick="start('${S.mode}')">🔁 Berriro (galdera berriak)</button><button class="alt" onclick="home()">Hasierara</button></div>${miss}`;
 window.scrollTo(0,0);
}
function readSheet(){
 const bold=s=>{let t=s.t;s.k.forEach(k=>{t=t.replace(reK(k),(m,a,w)=>a+"\u0001"+w+"\u0002")});return esc(t).replace(/\u0001/g,"<b>").replace(/\u0002/g,"</b>")};
 app.innerHTML=`<div class="top"><span>📖 Fitxa</span><button class="ghost" onclick="home()">✖ Irten</button></div>
 <div class="card ficha"><p>Irakurri esaldiak ahots goran. Letra lodiek gako-hitzak erakusten dituzte.</p>`+
 SECT.map(sc=>`<h2>${esc(sc.h)}</h2>`+SEN.slice(sc.a,sc.b+1).map(s=>`<p>${bold(s)}</p>`).join("")).join("")+
 `<h2>Irudia</h2>${fig(-1,false)}</div><button class="alt" onclick="home()">Hasierara</button>`;
 window.scrollTo(0,0);
}
home();
