<title>Iraitz aparatua: jokoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Diseño: mismo estilo que el resto de juegos LH6 (tarjetas redondeadas, colores cálidos, botones grandes, móvil) */
:root{--bg:#fff4e0;--card:#fff;--ink:#2b2350;--pri:#ff6b4a;--ok:#1f9d63;--bad:#d6334f;--sec:#5b4bdb;--link:#5b4bdb;--line:#e8d9bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--link:#b9afff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1838;--card:#2a2350;--ink:#fff3de;--line:#443b75;--link:#b9afff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:8px 0 4px;text-wrap:balance}
p{margin:6px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;font-weight:700;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;margin:6px 0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sec)}
button.big{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-size:19px}
button.alt{border-color:var(--sec)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
button.sel{background:var(--sec);color:#fff;border-color:var(--sec)}
button.sec{display:flex;gap:14px;align-items:center;padding:16px}
button.sec .ico{font-size:38px;flex:none}
button.sec .t{font-size:20px;font-weight:800}
button.sec .d{font-weight:400;font-size:15px;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:20px;font-weight:700}
.fb{min-height:48px;font-weight:700}
.note{font-size:15px;opacity:.9}
.slot{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:5px 0;min-height:42px}
.big-n{font-size:48px;font-weight:800;text-align:center}
.back{background:none;border:none;width:auto;padding:4px 0;color:var(--link)}
a.home{display:inline-block;font-weight:700;color:var(--link);text-decoration:none;padding:6px 0}
img.fig{display:block;width:100%;max-width:440px;margin:8px auto;border-radius:12px;border:2px solid var(--line);background:#fff}
input#ans{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:inherit}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const $=id=>document.getElementById(id),app=$("app");
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
/* ===== Ez errepikatu: tandak eta partidak artean ===== */
function qkey(x){return typeof x==="string"?x:Array.isArray(x)?String(x[0]):(x.t||x.id||x.name||x.n||JSON.stringify(x))+(x.a||"")}
function draw(ns,pool,n){
 let h={};try{h=JSON.parse(localStorage.getItem("seen_"+ns)||"{}")}catch(e){}
 let pick=sh(pool.filter(x=>!h[qkey(x)])).slice(0,n);
 if(pick.length<n){h={};const ks=new Set(pick.map(qkey));pick=pick.concat(sh(pool.filter(x=>!ks.has(qkey(x)))).slice(0,n-pick.length))}
 pick.forEach(x=>h[qkey(x)]=1);
 try{localStorage.setItem("seen_"+ns,JSON.stringify(h))}catch(e){}
 return sh(pick);
}
/* ===== Esaldiak hitzez hitz: hitz gakoak eta bariante okerrak ===== */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.,;:()¿?¡!_]/g," ").replace(/\s+/g," ").trim();
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const rx=k=>new RegExp("(?<![\\p{L}])"+esc(k)+"(?![\\p{L}])","iu");
const keysOf=s=>s.k.filter(k=>rx(k).test(s.t));
function variants(s){
 const out=new Set(),GR=C.GR;
 keysOf(s).forEach(k=>{
  const kl=k.toLowerCase();
  const pool=[...new Set(GR.filter(g=>g.includes(kl)).flat())].filter(w=>w!==kl&&!rx(w).test(s.t));
  pool.forEach(w=>{
   const m=s.t.match(rx(k))[0],up=m[0]!==m[0].toLowerCase();
   const ww=(up?w[0].toUpperCase():w[0])+w.slice(1);
   out.add(s.t.replace(rx(k),()=>ww));
  });
 });
 (s.v||[]).forEach(v=>out.add(v));
 return [...out];
}
function tfPool(S){
 if(S._tf)return S._tf;
 const seen=new Set(),out=[];
 const add=x=>{if(!seen.has(x[0])){seen.add(x[0]);out.push(x)}};
 const keepC=C;C=S;
 S.TT.forEach(add);
 S.SENT.forEach(s=>{add([s.t,1]);const v=variants(s),st=Math.max(1,Math.ceil(v.length/3));v.filter((_,i)=>i%st===0).slice(0,3).forEach(w=>add([w,0]))});
 C=keepC;S._tf=out;return out;
}
let C=null,score=0,i=0,qs=[],lock=false,maxPts=100;
const bestKey=()=>"best_iraitz_"+C.key;
const getBest=()=>{try{return +localStorage.getItem(bestKey())||0}catch(e){return 0}};
/* ===== Pantailak ===== */
function home(){
 C=null;
 app.innerHTML=`<a class="home" href="/">🏠 Home</a><h1>Iraitz aparatua 💧</h1><p>Aukeratu zein fitxa ikasi nahi duzun.</p>
 ${Object.keys(SEC).map(k=>{const s=SEC[k];return `<button class="sec" data-s="${k}"><span class="ico">${s.icon}</span><span><div class="t">${s.title}</div><div class="d">${s.sub}</div></span></button>`}).join("")}`;
 app.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>{C=SEC[b.dataset.s];menu()});
}
function menu(){
 const modes=[];
 if(C.STEPS)modes.push(["startOrder","🔢 "+C.orderTitle]);
 modes.push(["startBlank","✏️ Bete hutsuneak"],["startWhat","❓ Galderak"],["startTF","✅ Egia ala gezurra?"]);
 if(C.img)modes.push(["startImg","🖼️ Irudia ezagutu"]);
 if(C.FQ)modes.push(["startFQ","📋 Fitxako galderak"]);
 app.innerHTML=`<a class="home" href="/">🏠 Home</a><h1>${C.icon} ${C.title}</h1><p>${C.sub}</p>
 <div class="card">${modes.map((m,n)=>`<button class="big" data-f="${m[0]}">${n+1}. ${m[1]}</button>`).join("")}</div>
 <div class="card"><p class="q">Ikasi fitxako esaldiak hitzez hitz</p>
 <button class="alt" data-f="startBuild">📝 Osatu esaldia (zatiak ordenatu)</button>
 <button class="alt" data-f="startType">⌨️ Idatzi falta dena</button>
 <button class="alt" data-f="startExact">🔎 Zein esaldi dago zuzen?</button></div>
 <p>Errekorra: ${getBest()} puntu</p><button class="alt" id="other">Beste fitxa bat aukeratu</button>`;
 app.querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>window[b.dataset.f]());
 $("other").onclick=home;
}
function head(){return `<div class="top"><button class="back" onclick="menu()">← Atzera</button><span>⭐ ${score}</span></div><div class="bar"><i style="width:${Math.min(100,i/qs.length*100)}%"></i></div>`}
function end(){
 const b=getBest();if(score>b){try{localStorage.setItem(bestKey(),score)}catch(e){}}
 const m=score>=maxPts*.8?"Bikain! Maisua zara! 🏆":score>=maxPts*.5?"Oso ondo! Errepasatu pixka bat 👍":"Saiatu berriro, lortuko duzu! 💪";
 app.innerHTML=`<div class="card"><div class="big-n">${score}</div><p style="text-align:center" class="q">${m}</p><button class="big" onclick="menu()">Atzera</button></div>`;
}
/* aukera anitzeko galdera orokorra */
function choice(text,sub,right,wrong,done,pre){
 lock=false;
 const opts=sh([right,...wrong]);
 app.innerHTML=head()+`<div class="card"><p class="q">${text}</p>${pre||""}<p>${sub}</p>${opts.map(x=>`<button data-n="${x}">${x}</button>`).join("")}<p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-n]").forEach(b=>b.onclick=()=>{
  if(lock)return;lock=true;
  if(b.dataset.n===right){score+=10;b.classList.add("ok");$("fb").textContent="Zuzena! +10 🎉"}
  else{b.classList.add("bad");app.querySelectorAll("button[data-n]").forEach(c=>{if(c.dataset.n===right)c.classList.add("ok")});$("fb").textContent="Ez da zuzena. Zuzena: "+right}
  setTimeout(()=>{i++;done()},1400)});
}
/* 1. Ordenatu */
let next=0,S=[];
function startOrder(){score=0;i=0;qs=[1,2,3];maxPts=3*5*4;orderRound()}
function orderRound(){
 if(i>=qs.length)return end();
 next=0;{const L=Math.min(C.STEPS.length,4+Math.floor(Math.random()*3)),st=Math.floor(Math.random()*(C.STEPS.length-L+1));S=C.STEPS.slice(st,st+L)}
 app.innerHTML=head()+`<div class="card"><p class="q">Ukitu urratsak ordenan, lehenengotik azkenera!</p>
 <div>${S.map((_,k)=>`<div class="slot" id="s${k}"></div>`).join("")}</div>
 <div id="chips">${sh(S.map((s,k)=>k)).map(k=>`<button data-k="${k}">${S[k]}</button>`).join("")}</div><p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{
  if(+b.dataset.k===next){
   $("s"+next).textContent=(next+1)+". "+S[next];b.remove();next++;$("fb").textContent="Ondo! 👍";score+=5;
   if(next===S.length){$("fb").textContent="Prozesua osatu duzu! 🎉";setTimeout(()=>{i++;orderRound()},1500)}
  }else{$("fb").textContent="Hori ez da hurrengo urratsa. Saiatu berriro!";score=Math.max(0,score-2)}
 });
}
/* 2. Hutsuneak */
function startBlank(){score=0;i=0;qs=draw("blank_"+C.key,C.BLANKS,10);maxPts=100;blank()}
function blank(){
 if(i>=qs.length)return end();
 const q=qs[i];choice(q[0].replace("___","_____"),"Aukeratu hitz zuzena.",q[1],q[2],blank);
}
/* 3. Galderak */
function startWhat(){score=0;i=0;qs=draw("what_"+C.key,C.WQ,10);maxPts=100;what()}
function what(){
 if(i>=qs.length)return end();
 const q=qs[i];choice(q[0],"Aukeratu erantzun zuzena.",q[1],q[2],what);
}
/* 4. Egia ala gezurra */
function startTF(){
 score=0;i=0;const P=tfPool(C);
 qs=sh([...draw("tfT_"+C.key,P.filter(x=>x[1]),5),...draw("tfF_"+C.key,P.filter(x=>!x[1]),5)]);maxPts=100;tf();
}
function tf(){
 if(i>=qs.length)return end();
 lock=false;const q=qs[i];
 app.innerHTML=head()+`<div class="card"><p class="q">${q[0]}</p><button data-v="1">✅ Egia</button><button data-v="0">❌ Gezurra</button><p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{
  if(lock)return;lock=true;const r=(+b.dataset.v)===q[1];
  if(r){score+=10;b.classList.add("ok");$("fb").textContent="Zuzena! +10 🎉"}
  else{b.classList.add("bad");$("fb").textContent="Ez. Erantzuna: "+(q[1]?"egia":"gezurra")}
  setTimeout(()=>{i++;tf()},1300)});
}
/* 5. Irudia */
function startImg(){
 score=0;i=0;maxPts=100;const pool=[];
 C.img.names.forEach((_,k)=>{pool.push({t:"a"+k,k,m:0});pool.push({t:"b"+k,k,m:1})});
 qs=draw("img_"+C.key,pool,10);imgQ();
}
function imgQ(){
 if(i>=qs.length)return end();
 const q=qs[i],N=C.img.names,pic=`<img class="fig" alt="Irudia zenbakiekin" src="${C.img.src}">`;
 if(q.m===0)choice(`Zein da <b>${q.k+1}</b> zenbakia?`,"Begiratu irudia eta aukeratu izena.",N[q.k],sh(N.filter((_,j)=>j!==q.k)).slice(0,3),imgQ,pic);
 else choice(`Zein zenbakik adierazten du: <b>${N[q.k]}</b>?`,"Aukeratu zenbakia.",String(q.k+1),sh(N.map((_,j)=>String(j+1)).filter(x=>x!==String(q.k+1))).slice(0,3),imgQ,pic);
}
/* 6. Fitxako galderak */
function startFQ(){score=0;i=0;qs=sh(C.FQ.slice());maxPts=qs.length*10;fq()}
function fq(){
 if(i>=qs.length)return end();
 const q=qs[i];choice(q[0],"Aukeratu erantzun zuzena.",q[1],q[2],fq);
}
/* ===== ESALDIAK HITZEZ HITZ IKASTEKO MODUAK ===== */
function lit(s){return `<p class="note">📖 Fitxan: <b>${s.t}</b></p>`}
/* A. Osatu esaldia */
let bPos=0,bErr=0;
function startBuild(){score=0;i=0;qs=draw("build_"+C.key,C.SENT,8);maxPts=80;build()}
function build(){
 if(i>=qs.length)return end();
 const s=qs[i];bPos=0;bErr=0;lock=false;
 app.innerHTML=head()+`<div class="card"><p class="q">Osatu esaldia, fitxan dagoen bezala</p><div class="slot" id="bs" style="min-height:72px"></div><div id="bc">${sh(s.c.map((c,k)=>k)).map(k=>`<button data-k="${k}">${s.c[k]}</button>`).join("")}</div><p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{
  if(lock)return;
  if(+b.dataset.k===bPos){
   $("bs").textContent=s.c.slice(0,bPos+1).join(" ");b.remove();bPos++;$("fb").textContent="Ondo! 👍";
   if(bPos===s.c.length){lock=true;const pts=bErr===0?10:bErr<3?5:2;score+=pts;$("fb").textContent="Esaldi osoa! +"+pts+" 🎉";setTimeout(()=>{i++;build()},1600)}
  }else{bErr++;$("fb").textContent="Hori ez da hurrengo zatia. Saiatu berriro!"}
 });
}
/* B. Idatzi falta dena */
function startType(){score=0;i=0;qs=draw("type_"+C.key,C.SENT.filter(s=>keysOf(s).length),8);maxPts=80;typeQ()}
function typeQ(){
 if(i>=qs.length)return end();
 const s=qs[i],ks=keysOf(s),k=ks[Math.floor(Math.random()*ks.length)];
 let tries=0,hint=false;lock=false;
 app.innerHTML=head()+`<div class="card"><p class="q">${s.t.replace(rx(k),()=>"_____")}</p><p class="note">Idatzi falta dena (${k.replace(/\s/g,"").length} letra)</p>
 <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Erantzuna">
 <button class="big" id="ck">Egiaztatu</button><button id="hn" style="text-align:center">💡 Pista</button><p class="fb" id="fb"></p><div id="lt"></div></div>`;
 const nx=ms=>{lock=true;$("lt").innerHTML=lit(s);setTimeout(()=>{i++;typeQ()},ms)};
 $("hn").onclick=()=>{if(lock)return;hint=true;$("fb").textContent="Hasten da: "+k[0]+"…"};
 const check=()=>{
  if(lock)return;
  if(norm($("ans").value)===norm(k)){const pts=hint?5:tries===0?10:5;score+=pts;$("fb").textContent="Zuzena! +"+pts+" 🎉";nx(2200)}
  else{tries++;if(tries>=3){$("fb").textContent="Erantzuna: "+k;nx(3200)}else $("fb").textContent="Ez da zuzena. Saiatu berriro!"}
 };
 $("ck").onclick=check;$("ans").onkeydown=e=>{if(e.key==="Enter")check()};$("ans").focus();
}
/* C. Zein esaldi da zuzena? */
function startExact(){score=0;i=0;qs=draw("exact_"+C.key,C.SENT.filter(s=>variants(s).length>=2),8);maxPts=80;exact()}
function exact(){
 if(i>=qs.length)return end();
 const s=qs[i];lock=false;
 const opts=sh([s.t,...sh(variants(s)).slice(0,2)]);
 app.innerHTML=head()+`<div class="card"><p class="q">Zein esaldi dago zuzen, fitxan dagoen bezala?</p>${opts.map(o=>`<button data-o="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("")}<p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{
  if(lock)return;lock=true;
  if(b.dataset.o===s.t){score+=10;b.classList.add("ok");$("fb").textContent="Zuzena! +10 🎉"}
  else{b.classList.add("bad");app.querySelectorAll("button[data-o]").forEach(c=>{if(c.dataset.o===s.t)c.classList.add("ok")});$("fb").textContent="Ez. Zuzena berdez dago."}
  setTimeout(()=>{i++;exact()},2400)});
}
/* ===== Hasiera: #gernu edo #izerdi helbideak fitxa zuzenean irekitzen du ===== */
const H=(location.hash||"").replace("#","");
if(SEC[H]){C=SEC[H];menu()}else home();
</script>
