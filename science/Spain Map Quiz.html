*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4}

h1{font-size:26px;margin:8px 0 4px}
p{margin:6px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
button{font:inherit;font-weight:700;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;text-align:left;margin:5px 0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sec)}
button.big{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-size:18px}
button.alt{background:var(--sec);color:#fff;border-color:var(--sec);text-align:center;font-size:18px}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.back{background:none;border:none;width:auto;padding:4px 0;color:var(--sec);margin:0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:21px;font-weight:800}
.fb{min-height:26px;font-weight:700;margin:4px 0}
.wrap{overflow:auto;max-height:62vh;border:2px solid var(--line);border-radius:14px;background:var(--sea);touch-action:pan-x pan-y pinch-zoom}
.wrap svg{display:block;width:100%;height:auto}
.zoom{display:flex;gap:8px;margin:6px 0}
.zoom button{text-align:center;margin:0;width:auto;flex:1}
.big-n{font-size:48px;font-weight:800;text-align:center}
.u{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 button{margin:0}
.note{font-size:14px;opacity:.75}

 const h=HUE[u.items[0].c];return level==="com"?`hsl(${h},60%,72%)`:`hsl(${h},55%,${66+(k%3)*7}%)`;
}
function pts(a){return a.map((v,k)=>k%2?","+v+" ":v).join("").trim()}
function svgMap(){
 const fr=G.frame,P=[];
 let h=`<svg viewBox="0 0 740 670" id="map" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="cp"><polygon points="${pts(G.out)}"/></clipPath></defs>
 <rect x="${fr[0]}" y="${fr[1]}" width="${fr[2]-fr[0]}" height="${fr[3]-fr[1]}" rx="8" fill="none" stroke="#7a8aa8" stroke-dasharray="5 4"/>`;
 const us=units();
 us.forEach((u,k)=>{
  const peninsula=u.items.filter(d=>d.k==="p"),other=u.items.filter(d=>d.k!=="p");
  const mk=(items,cl)=>{
   const polys=items.flatMap(d=>d.polys);
   return `<g ${cl?'clip-path="url(#cp)"':""}>`+polys.map(p=>`<polygon points="${pts(p)}" class="s" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`).join("")+polys.map(p=>`<polygon points="${pts(p)}" class="f" stroke-width="1.4" stroke-linejoin="round"/>`).join("")+`</g>`;
  };
  h+=`<g class="u" data-id="${u.id.replace(/"/g,"")}" data-k="${k}">${peninsula.length?mk(peninsula,true):""}${other.length?mk(other,false):""}</g>`;
 });
 if(level==="prov")h+=`<path d="${G.cb}" clip-path="url(#cp)" fill="none" stroke="#2b2350" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`;
 h+=`<polygon points="${pts(G.out)}" fill="none" stroke="#4a5568" stroke-width="1.6" stroke-linejoin="round" pointer-events="none"/></svg>`;
 return h;
}
function paintAll(){
 const us=units();
 document.querySelectorAll("#map g.u").forEach(g=>{
  const u=us[+g.dataset.k];if(!u)return;
  const c=color(u,+g.dataset.k);
  g.querySelectorAll("polygon.f").forEach(p=>{p.setAttribute("fill",c);p.setAttribute("stroke",c)});
  g.querySelectorAll("polygon.s").forEach(p=>p.setAttribute("stroke","#fff"));
  if(level==="prov"&&g.dataset.id==="x"){}
 });
}
function paint(id,fill,stroke){
 const g=[...document.querySelectorAll("#map g.u")].find(x=>x.dataset.id===id);if(!g)return;
 g.querySelectorAll("polygon.f").forEach(p=>{p.setAttribute("fill",fill);p.setAttribute("stroke",stroke||fill)});
}
function mapBlock(){
 return `<div class="wrap" id="wrap">${svgMap()}</div>${level==="prov"?'<p class="note">Thick dark lines = borders between communities.</p>':""}<div class="zoom"><button onclick="setZoom(-1)">➖ Zoom out</button><button onclick="setZoom(1)">➕ Zoom in</button></div>`;
}
function setZoom(d){zoom=Math.max(1,Math.min(4,zoom+d));$("map").style.width=zoom*100+"%"}
function head(){return `<div class="top"><button class="back" onclick="home()">← Menu</button><span>⭐ ${score}</span></div><div class="bar"><i style="width:${qs.length?i/qs.length*100:0}%"></i></div>`}
function home(){
 zoom=1;
 app.innerHTML=`<h1>Spain Map Quiz 🗺️</h1><p>Learn the autonomous communities and provinces on a silent map.</p>
 <div class="card"><p class="q">Autonomous communities</p>
 <button class="big" onclick="start('com','learn')">👆 Explore the map</button>
 <button class="big" onclick="start('com','find')">🎯 Find it on the map</button></div>
 <div class="card"><p class="q">Provinces</p>
 <button class="alt" onclick="start('prov','learn')">👆 Explore the map</button>
 <button class="alt" onclick="start('prov','find')">🎯 Find it on the map</button>
 <button class="alt" onclick="start('prov','which')">🧩 Which community is it in?</button></div>
 <div class="card"><p class="q">Flags of the communities</p>
 <button class="alt" onclick="flagsLearn()">🏳️ Study the flags</button>
 <button class="alt" onclick="startFlags('name')">❓ Whose flag is this?</button>
 <button class="alt" onclick="startFlags('flag')">🚩 Find the flag</button>
 <p class="note">Official flags with coats of arms. Images: Wikimedia Commons.</p></div>
 <p>Best score: ${best} points</p>
 <p class="note">The map is simplified: borders are approximate, so use it to learn locations, not exact shapes.</p>`;
}
function start(l,m){
 level=l;mode=m;score=0;i=0;wrong=0;lock=false;zoom=1;
 const us=units();
 if(m==="learn"){
  app.innerHTML=head()+`<div class="card"><p class="q" id="nm">Tap any region to see its name</p><p id="sub" class="note"></p></div>`+mapBlock();
  qs=[];paintAll();
  $("map").addEventListener("click",e=>{
   const g=e.target.closest("g.u");if(!g)return;
   paintAll();const u=us[+g.dataset.k];paint(u.id,"#ffd23f","#e09f00");
   $("nm").textContent=u.name;$("sub").textContent=level==="prov"?"Community: "+u.com:"";
  });
  return;
 }
 qs=sh(us).slice(0,10);
 m==="find"?findQ():whichQ();
}
function findQ(){
 if(i>=qs.length)return end();
 const u=qs[i];wrong=0;lock=false;
 const done=document.querySelector("#map")?null:null;
 app.innerHTML=head()+`<div class="card"><p class="q">Find: ${u.name}</p><p class="fb" id="fb">Tap the map</p><button onclick="skip()" style="text-align:center">Skip ⏭</button></div>`+mapBlock();
 paintAll();
 qs.slice(0,i).forEach(x=>{if(x.ok)paint(x.id,"#37b26c","#1f9d63")});
 $("map").style.width=zoom*100+"%";
 $("map").addEventListener("click",e=>{
  if(lock)return;const g=e.target.closest("g.u");if(!g)return;
  const us=units(),t=us[+g.dataset.k];
  if(t.id===u.id){lock=true;score+=wrong===0?10:5;u.ok=true;paint(u.id,"#37b26c","#1f9d63");$("fb").textContent=wrong===0?"Correct! +10 🎉":"Correct! +5 👍";setTimeout(()=>{i++;findQ()},1000)}
  else{wrong++;
   if(wrong>=2)reveal(u,"That was "+t.name+". It's the yellow one.");
   else $("fb").textContent="Not quite. That's "+t.name+". Try again!"}
 });
}
function reveal(u,msg){lock=true;paint(u.id,"#ffd23f","#e09f00");$("fb").textContent=msg;setTimeout(()=>{i++;findQ()},2200)}
function skip(){if(lock)return;const u=qs[i];reveal(u,"It's the yellow one: "+u.name)}
function whichQ(){
 if(i>=qs.length)return end();
 const u=qs[i];lock=false;
 const right=u.com,coms=COMS.filter(c=>c!==right&&c!=="Ceuta"&&c!=="Melilla"),opts=sh([right,...sh(coms).slice(0,3)]);
 app.innerHTML=head()+`<div class="card"><p class="q">Which community is the highlighted province in?</p><div class="grid2">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join("")}</div><p class="fb" id="fb"></p></div>`+mapBlock();
 paintAll();paint(u.id,"#ff6b4a","#c2410c");$("map").style.width=zoom*100+"%";
 app.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{
  if(lock)return;lock=true;
  if(b.dataset.o===right){score+=10;b.classList.add("ok");$("fb").textContent="Correct! "+u.name+" is in "+right+" 🎉"}
  else{b.classList.add("bad");app.querySelectorAll("button[data-o]").forEach(c=>{if(c.dataset.o===right)c.classList.add("ok")});$("fb").textContent=u.name+" is in "+right}
  setTimeout(()=>{i++;whichQ()},1900)});
}
function end(){
 if(score>best){best=score;try{localStorage.setItem("esbest",best)}catch(e){}}
 const m=score>=80?"Amazing! Geography champion! 🏆":score>=50?"Great job! Keep practising 👍":"Keep trying, you'll get there! 💪";
 app.innerHTML=`<div class="card"><div class="big-n">${score}</div><p class="q" style="text-align:center">${m}</p><button class="big" onclick="home()">Back to menu</button></div>`;
}

const FN=Object.keys(FI);
const flagSvg=n=>`<div style="aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden"><img src="${FI[n]}" alt="Flag" style="max-width:100%;max-height:100%;display:block"></div>`;
function flagsLearn(){
 app.innerHTML=`<div class="top"><button class="back" onclick="home()">← Menu</button><span></span></div><div class="card"><p class="q">Study the flags</p><p>Tap a flag to show or hide its name.</p><div class="grid2" id="fg">${FN.map(n=>`<div style="cursor:pointer" data-n="${n}">${flagSvg(n)}<p class="fb" style="text-align:center;margin:4px 0;min-height:24px"></p></div>`).join("")}</div></div>`;
 $("fg").onclick=e=>{const d=e.target.closest("[data-n]");if(!d)return;const p=d.querySelector("p");p.textContent=p.textContent?"":d.dataset.n};
}
function startFlags(kind){score=0;i=0;qs=sh(FN).slice(0,10);flagQ(kind)}
function flagQ(kind){
 if(i>=qs.length)return end();
 const right=qs[i],opts=sh([right,...sh(FN.filter(x=>x!==right)).slice(0,3)]);lock=false;
 const name=kind==="name";
 app.innerHTML=head()+`<div class="card">${name?`<p class="q">Whose flag is this?</p><div style="max-width:300px;margin:8px auto">${flagSvg(right)}</div><div class="grid2">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join("")}</div>`:`<p class="q">Find the flag of ${right}</p><div class="grid2">${opts.map(o=>`<button data-o="${o}" style="padding:6px">${flagSvg(o)}</button>`).join("")}</div>`}<p class="fb" id="fb"></p></div>`;
 app.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{
  if(lock)return;lock=true;
  if(b.dataset.o===right){score+=10;b.classList.add("ok");$("fb").textContent="Correct! +10 🎉"}
  else{b.classList.add("bad");app.querySelectorAll("button[data-o]").forEach(c=>{if(c.dataset.o===right)c.classList.add("ok")});$("fb").textContent=name?"It's the flag of "+right:"That was the flag of "+b.dataset.o}
  setTimeout(()=>{i++;flagQ(kind)},1700)});
}
home();
</script></body></html>
