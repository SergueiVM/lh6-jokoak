<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Relief of Spain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of rounded cards, big tap targets. Menu -> round (one question per screen) -> results. Same warm palette as the other study games. */
:root{
  --bg:#fff4e0; --card:#ffffff; --ink:#2b2350; --muted:#6a6286; --line:#e8d9bd;
  --pri:#e5502c; --on-pri:#ffffff; --sec:#5b4bdb; --sec-text:#5b4bdb; --chip:#fff8ea;
  --good:#1b7f45; --good-bg:#e1f5e8; --bad:#c3342c; --bad-bg:#fde6e3; --focus:#5b4bdb;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--font)}
main{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:6px 0}

.home{display:inline-flex;align-items:center;min-height:44px;color:var(--sec-text);font-weight:800;text-decoration:none}
.hero h1{font-size:30px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 4px}
h2.grp{font-size:15px;margin:26px 0 2px;text-transform:uppercase;letter-spacing:.06em;color:var(--sec-text);border-bottom:2px solid var(--line);padding-bottom:6px}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;cursor:pointer;font-size:17px}
.mode:hover{border-color:var(--pri)}
.ico{font-size:38px;flex:none}
.t,.d{display:block}
.t{font-weight:800;font-size:19px}
.d{color:var(--muted);font-size:15px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
.prog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:30px}
.bar{height:100%;background:var(--pri);border-radius:99px}
.count,.score{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.qtype{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sec-text)}
.lead{margin:10px 0 0;color:var(--muted);font-style:italic}
.q{font-size:20px;font-weight:700;margin:8px 0 12px;text-wrap:pretty}
.sentence{line-height:1.7}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--pri);text-align:center;padding:0 6px;margin:0 2px}
.blank.good{border-color:var(--good);color:var(--good)}
.blank.bad{border-color:var(--bad);color:var(--bad)}

.map{display:block;width:100%;margin:12px 0 4px;padding:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:zoom-in}
.map img{display:block;width:100%;height:auto}
.maphint{color:var(--muted);font-size:14px;margin:0 0 8px}
.tapbar{display:flex;justify-content:flex-end;margin:10px 0 8px}
.tapscroll{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:#fff}
.tapmap{position:relative;width:100%}
.tapscroll.big .tapmap{width:190%}
.tapmap img{display:block;width:100%;height:auto}
.hot{position:absolute;width:8%;min-width:30px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed var(--sec);background:transparent;padding:0;cursor:pointer}
.hot:hover:not(:disabled){background:rgba(91,75,219,.18)}
.hot:disabled{cursor:default}
.hot.good{border:4px solid var(--good)}
.hot.bad{border:4px solid var(--bad)}
.zoom{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.zoom .zbar{position:sticky;top:0;left:0;display:flex;justify-content:flex-end;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));background:var(--bg);z-index:2}
.zoom img{display:block;width:210%;max-width:none;height:auto;background:#fff}

.opts{display:grid;gap:10px}
.opt{display:block;width:100%;min-height:56px;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:18px;cursor:pointer}
.opts.nums{grid-template-columns:1fr 1fr}
.opts.nums .opt{text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good,.mbtn.done{background:var(--good-bg);border-color:var(--good)}
.opt.bad,.mbtn.wrong{background:var(--bad-bg);border-color:var(--bad)}

.btn{min-height:56px;padding:0 22px;border:2px solid var(--pri);border-radius:16px;background:var(--pri);color:var(--on-pri);font-size:18px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 140px}

.slot,.bank{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-width:0}
.slot{min-height:68px;padding:10px;border:2px dashed var(--line);border-radius:16px;margin-bottom:14px}
.slot.good{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.ph{color:var(--muted);align-self:center}
.chip{min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:17px;text-align:left;cursor:pointer;max-width:100%}
.chip.in{background:var(--card);border-color:var(--sec)}
.chip:disabled{cursor:default;color:var(--ink)}

.txt{width:100%;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:20px}
.txt.good{border-color:var(--good);background:var(--good-bg)}
.txt.bad{border-color:var(--bad);background:var(--bad-bg)}
.note{color:var(--muted);min-height:1.4em;margin-top:8px}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start;min-width:0}
.mbtn{width:100%;min-height:62px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:16px;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--sec);background:var(--card);box-shadow:0 0 0 2px var(--sec)}
.mbtn.done{cursor:default;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .mbtn.wrong{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}

.fb{border-radius:18px;padding:14px 16px;border:2px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .ans,.fb .src{margin-top:8px}
.lab{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fb .btn{width:100%;margin-top:14px}

.big{font-size:52px;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums}
.rev{margin:10px 0;padding-top:10px;border-top:2px solid var(--line)}
.read h2{font-size:21px;margin:4px 0 10px;text-wrap:balance}
.read .row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline;padding:10px 0;border-top:2px solid var(--line)}
.read .row:first-of-type{border-top:0}
.read .num{font-weight:800;font-size:22px;color:var(--sec-text);font-variant-numeric:tabular-nums;text-align:center}
.read .en{font-weight:800}
.read .es{color:var(--muted);font-style:italic}
.read .alt{color:var(--muted);font-size:15px}
</style>

<main id="app"></main>

{n:12,en:"Morena range",             es:"Sierra Morena",              bad:["Morena rage","Marena range","Morena rangue"]},
{n:13,en:"Pyrenees",                 es:"Pirineos",                   bad:["Pyrenes","Pyrenneys","Pirenees"]},
{n:14,en:"Basque mountains",         es:"Montes Vascos",              bad:["Basque mountain","Basque montains","Vasque mountains"]},
{n:15,en:"Betic system",             es:"Sistema Bético",             bad:["Betic sistem","Betik system","Bettic system"]},
{n:18,en:"Catalan Coastal range",    es:"Cordillera Costera Catalana",bad:["Catalan Coster range","Catalan Coastal rage","Catalan Costal range"]}
];
/* Other names for the same place, as shown in the online map game (Didactalia). The worksheet names stay the main ones. */
const ALT={2:["Northern plateau"],3:["Southern plateau"],4:["Ebro basin"],5:["Baetic depression","Guadalquivir depression"],7:["Montes de Toledo","Toledo Mountains"],10:["Cantabrian Mountains"],12:["Sierra Morena"],15:["Baetic system"],18:["Catalan coastal ranges"]};
R.forEach(r=>{r.alt=ALT[r.n]||[];});
/* Extra remarks for the reading screen. */
const NOTE={14:"The online game counts it as part of the Cantabrian Mountains."};
const src=r=>r.n+" · "+r.en+" · "+r.es;
const srcEn=r=>r.n+" · "+r.en;
const pickN=(a,n)=>shuffle(a).slice(0,n);

/* ---------- question builders ---------- */
const choiceQ=o=>({type:"choice",label:o.label,q:o.q,lead:o.lead,map:!!o.map,nums:!!o.nums,options:shuffle([o.a].concat(o.w)),correct:o.a,srcText:o.srcText});
const POOL={map:[],find:[],es:[],order:[],gap:[],write:[],spell:[],match:[],tap:[]};
R.forEach(r=>{
  const others=R.filter(x=>x!==r);
  POOL.map.push({id:"map-"+r.n,build:()=>choiceQ({label:"Look at the map",q:"What is number "+r.n+" on the map?",map:true,a:r.en,w:pickN(others,3).map(x=>x.en),srcText:src(r)})});
  POOL.find.push({id:"find-"+r.n,build:()=>{const names=(r.n===10?[r.en]:[r.en].concat(r.alt));const name=names[rnd(names.length)];return choiceQ({label:"Find the number",q:"Which number on the map is the \""+name+"\"?",map:true,nums:true,a:String(r.n),w:pickN(others,3).map(x=>String(x.n)),srcText:srcEn(r)});}});
  POOL.es.push({id:"es1-"+r.n,build:()=>choiceQ({label:"English and Spanish",q:"How do you say \""+r.es+"\" in English?",a:r.en,w:pickN(others,3).map(x=>x.en),srcText:src(r)})});
  POOL.es.push({id:"es2-"+r.n,build:()=>choiceQ({label:"English and Spanish",q:"What is \""+r.en+"\" in Spanish?",a:r.es,w:pickN(others,3).map(x=>x.es),srcText:src(r)})});
  POOL.spell.push({id:"sp-"+r.n,build:()=>choiceQ({label:"Spell it right",q:"Which spelling is correct?",lead:"In Spanish: "+r.es,a:r.en,w:pickN(r.bad,3),srcText:src(r)})});
  POOL.write.push({id:"wr-"+r.n,build:()=>({type:"gap",inline:false,map:true,label:"Write the name",prompt:"Write the English name of number "+r.n+" on the map.",answer:r.en,accept:[r.en].concat(r.alt),srcText:src(r)})});
  const words=r.en.split(" ");
  if(words.length>=2){
    POOL.order.push({id:"or-"+r.n,build:()=>{
      let sh=words.map((t,i)=>({t,i}));
      do{sh=shuffle(sh);}while(sh.every((x,i)=>x.i===i));
      return{type:"order",label:"Put the words in order",lead:"In Spanish: "+r.es,parts:sh,target:r.en,srcText:src(r)};
    }});
    words.forEach((w,i)=>{
      if(w.length<3||/^(of|the)$/i.test(w))return;
      POOL.gap.push({id:"gp-"+r.n+"-"+i,build:()=>({type:"gap",inline:true,label:"Fill the gap",lead:"In Spanish: "+r.es,
        before:words.slice(0,i).join(" ")+(i?" ":""),after:(i<words.length-1?" ":"")+words.slice(i+1).join(" "),answer:w,accept:[w],srcText:src(r)})});
    });
  }
});
POOL.match.push(...R.map(r=>({id:"mt-"+r.n,l:r.en,r:r.es,src:src(r)})));
/* Where the number labels sit on the map picture (x of 1000, y of 885). 16 and 17 are not part of the game. */
const HOT={1:[513,272],2:[503,165],3:[524,542],4:[772,165],5:[385,730],6:[358,340],7:[620,410],8:[137,80],9:[328,112],10:[456,104],11:[795,268],12:[260,690],13:[764,53],14:[627,46],15:[778,618],18:[925,292]};
R.forEach(r=>{
  POOL.tap.push({id:"tap-"+r.n,build:()=>{
    const names=[r.en].concat(r.alt),name=names[rnd(names.length)];
    const alsoOk=(r.n===10&&name==="Cantabrian Mountains")?[14]:[];
    const parts=[];
    const rest=r.alt.filter(a=>a!==name);
    if(rest.length)parts.push("Also called: "+rest.join(" · "));
    if(alsoOk.length)parts.push("The online game counts the Basque mountains (14) as part of the Cantabrian Mountains, so 14 is also accepted");
    if(NOTE[r.n])parts.push(NOTE[r.n]);
    return{type:"tap",label:"Tap the map",name:name,n:r.n,alsoOk:alsoOk,srcText:srcEn(r),extra:parts.join(". ")};
  }});
});


/* ---------- engine ---------- */
const $app=document.getElementById("app");
let seen={};
try{seen=JSON.parse(localStorage.getItem("rs-seen")||"{}")||{};}catch(e){seen={};}
const bump=id=>{seen[id]=(seen[id]||0)+1;try{localStorage.setItem("rs-seen",JSON.stringify(seen));}catch(e){}};
const rank=items=>items.map(it=>({it,k:(seen[it.id]||0)+Math.random()*1.5})).sort((a,b)=>a.k-b.k).map(o=>o.it);

function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==="class")e.className=v;
    else if(k==="onclick")e.onclick=v;
    else if(k==="text")e.textContent=v;
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  add(e,...kids);return e;
}
function add(p,...k){k.flat().forEach(x=>{if(x!=null&&x!==false)p.append(x);});return p;}

/* The map photo. Tap to enlarge. */
function mapEl(){
  const b=h("button",{class:"map",type:"button","aria-label":"Enlarge the map"});
  const img=h("img",{src:MAP,alt:"Hand-drawn relief map of Spain and Portugal with numbers 1 to 18"});
  b.append(img);
  b.onclick=()=>{
    const z=h("div",{class:"zoom",role:"dialog","aria-label":"Map"});
    const close=h("button",{class:"back",type:"button",text:"✕ Close",onclick:()=>z.remove()});
    z.append(h("div",{class:"zbar"},close),h("img",{src:MAP,alt:""}));
    document.body.append(z);close.focus();
  };
  return [b,h("p",{class:"maphint",text:"Tap the map to enlarge it."})];
}

/* ---------- menu (the only screen with the Home link) ---------- */
let round=null;
function showMenu(){
  round=null;
  const m=(mode,icon,t,d)=>`<button class="mode" type="button" data-mode="${mode}"><span class="ico">${icon}</span><span><span class="t">${t}</span><span class="d">${d}</span></span></button>`;
  $app.innerHTML=`<a class="home" href="/">🏠 Home</a>
<header class="hero"><h1>Relief of Spain</h1><p class="sub">Plateaus, depressions, mountain systems and ranges on the map. New questions every round.</p></header>
<h2 class="grp">Read first</h2>
${m("read","📖","Read the map","The 16 names with their number and the Spanish name")}
<h2 class="grp">On the map</h2>
${m("map","🗺️","Number to name","Look at the map: what is number 7?")}
${m("tap","👆","Tap the map","Tap the right number: sheet names and other names")}
${m("find","🔢","Name to number","Which number is the Pyrenees?")}
${m("es","🇪🇸","English and Spanish","Say each name in both languages")}
${m("match","🔗","Match the pairs","English name with Spanish name")}
<h2 class="grp">Exact names</h2>
${m("order","🧩","Put the words in order","Build the name from its words")}
${m("gap","✍️","Fill the gap","Type the missing word exactly")}
${m("write","📝","Write the name","Type the whole name from its number")}
${m("spell","🔍","Spell it right","Only one spelling is correct")}
<h2 class="grp">Everything</h2>
${m("mix","🏆","Mix it up","12 questions of every kind")}`;
  $app.querySelectorAll("[data-mode]").forEach(b=>{b.onclick=()=>start(b.dataset.mode);});
  window.scrollTo(0,0);
}

/* ---------- rounds ---------- */
function start(mode){
  if(mode==="read")return showRead();
  round=buildRound(mode);
  showQ();
}
function pick(type,n){
  const out=[];
  for(const it of rank(POOL[type])){if(out.length>=n)break;out.push(it);bump(it.id);}
  return out;
}
function pickMix(n){
  const kinds=["map","find","es","spell","write","gap","gap","order","map","find","es","spell","tap"];
  const types=shuffle(kinds).slice(0,n),ranked={},out=[],usedKey=new Set();
  types.forEach(t=>{
    ranked[t]=ranked[t]||rank(POOL[t]);
    /* avoid asking about the same landform twice in one round */
    const it=ranked[t].find(x=>{const k=x.id.split("-")[1];return !usedKey.has(k)&&!out.includes(x);});
    if(it){usedKey.add(it.id.split("-")[1]);bump(it.id);out.push(it);}
  });
  return out;
}
function buildBoards(){
  const pool=rank(POOL.match).slice(0,8);pool.forEach(p=>bump(p.id));
  return [pool.slice(0,4),pool.slice(4,8)].map(b=>({type:"match",label:"Match the pairs",pairs:b}));
}
function buildRound(mode){
  const r={mode,qs:[],i:0,score:0,missed:[],answered:false};
  if(mode==="match"){r.qs=buildBoards();return r;}
  const items=mode==="mix"?pickMix(12):pick(mode,mode==="order"?8:10);
  r.qs=items.map(it=>it.build());
  return r;
}

function showQ(){
  const r=round,q=r.qs[r.i];r.answered=false;
  const star=h("span",{class:"score",text:"⭐ "+r.score});
  const bar=h("div",{class:"bar"});bar.style.width=(r.i/r.qs.length*100)+"%";
  const top=h("div",{class:"top"},
    h("button",{class:"back",type:"button",text:"← Menu",onclick:showMenu}),
    h("div",{class:"prog","aria-hidden":"true"},bar),
    h("span",{class:"count",text:(r.i+1)+" / "+r.qs.length}),star);
  const card=h("section",{class:"card"});
  const fb=h("div",{role:"status","aria-live":"polite"});
  const finish=(ok,info)=>{
    info=info||{};
    if(r.answered)return;r.answered=true;
    if(ok&&!info.hint){r.score++;star.textContent="⭐ "+r.score;}
    if(!ok){
      if(q.type==="match")(info.pairs||[]).forEach(p=>r.missed.push(p.src));
      else if(q.srcText)r.missed.push(q.srcText);
    }
    const last=r.i===r.qs.length-1;
    const srcLine=q.type==="match"?null:q.srcText;
    const box=h("div",{class:"fb "+(ok?"good":"bad")},
      h("strong",{text:ok?(info.hint?"Correct, but you used a hint, so no star.":"Correct! ⭐"):(q.type==="match"?"Finished. A few pairs needed another try.":"Not quite.")}),
      (!ok&&info.answer)?h("div",{class:"ans"},"The right answer: ",h("b",{text:info.answer})):null,
      srcLine?h("div",{class:"src"},h("span",{class:"lab",text:"On your sheet"}),h("span",{text:srcLine})):null,
      q.extra?h("div",{class:"src"},h("span",{class:"lab",text:"Good to know"}),h("span",{text:q.extra})):null,
      h("button",{class:"btn",type:"button",text:last?"See results":"Next →",onclick:()=>{r.i++;if(last)showResults();else showQ();}}));
    fb.replaceChildren(box);
    box.scrollIntoView({block:"nearest"});
  };
  ({choice:rChoice,order:rOrder,gap:rGap,match:rMatch,tap:rTap})[q.type](q,finish,card);
  $app.replaceChildren(top,card,fb);
  window.scrollTo(0,0);
  const first=card.querySelector("input");if(first)first.focus({preventScroll:true});
}

const head=q=>[h("div",{class:"qtype",text:q.label}),q.lead?h("p",{class:"lead",text:q.lead}):null];

function rChoice(q,finish,card){
  const list=h("div",{class:"opts"+(q.nums?" nums":"")});
  q.options.forEach(o=>{
    const b=h("button",{class:"opt",type:"button",text:o});
    b.onclick=()=>{
      [...list.children].forEach(x=>{x.disabled=true;if(x.textContent===q.correct)x.classList.add("good");});
      if(o!==q.correct)b.classList.add("bad");
      finish(o===q.correct,{answer:q.correct});
    };
    list.append(b);
  });
  add(card,head(q),h("p",{class:"q",text:q.q}),q.map?mapEl():null,list);
}

function rTap(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Tap the number of the \""+q.name+"\" on the map."}));
  const bigBtn=h("button",{class:"back",type:"button",text:"🔍 Bigger map"});
  const scroll=h("div",{class:"tapscroll"}),wrap=h("div",{class:"tapmap"});
  wrap.append(h("img",{src:MAP,alt:"Relief map of Spain and Portugal with numbers"}));
  const hs=[];
  Object.keys(HOT).forEach(k=>{
    const n=+k,pos=HOT[k];
    const b=h("button",{class:"hot",type:"button","aria-label":"Number "+n,style:"left:"+(pos[0]/10).toFixed(2)+"%;top:"+(pos[1]/8.85).toFixed(2)+"%"});
    b.onclick=()=>{
      const ok=n===q.n||q.alsoOk.includes(n);
      hs.forEach(o=>{o.b.disabled=true;});
      hs.find(o=>o.n===q.n).b.classList.add("good");
      if(ok&&n!==q.n)b.classList.add("good");
      if(!ok)b.classList.add("bad");
      finish(ok,{answer:"number "+q.n});
    };
    hs.push({n:n,b:b});wrap.append(b);
  });
  scroll.append(wrap);
  bigBtn.onclick=()=>{const on=scroll.classList.toggle("big");bigBtn.textContent=on?"🔍 Smaller map":"🔍 Bigger map";};
  add(card,h("div",{class:"tapbar"},bigBtn),scroll,h("p",{class:"maphint",text:"Use \"Bigger map\" if the numbers are small, then slide the map sideways."}));
}

function rOrder(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Tap the words in the right order to build the name."}));
  let ans=[],bank=q.parts.slice(),locked=false;
  const slot=h("div",{class:"slot"}),bankEl=h("div",{class:"bank"});
  const check=h("button",{class:"btn",type:"button",text:"Check"});
  const reset=h("button",{class:"btn ghost",type:"button",text:"Start again"});
  const chip=(c,fn,cls)=>h("button",{class:"chip"+(cls?" "+cls:""),type:"button",text:c.t,disabled:locked,onclick:fn});
  function draw(cls){
    slot.className="slot"+(cls?" "+cls:"");
    slot.replaceChildren(...(ans.length
      ?ans.map(c=>chip(c,()=>{ans=ans.filter(x=>x!==c);bank.push(c);draw();},"in"))
      :[h("span",{class:"ph",text:"The name goes here"})]));
    bankEl.replaceChildren(...bank.map(c=>chip(c,()=>{bank=bank.filter(x=>x!==c);ans.push(c);draw();})));
    check.disabled=locked||ans.length!==q.parts.length;
    reset.disabled=locked||!ans.length;
  }
  check.onclick=()=>{const ok=ans.map(c=>c.t).join(" ")===q.target;locked=true;draw(ok?"good":"bad");finish(ok,{answer:q.target});};
  reset.onclick=()=>{bank=q.parts.slice();ans=[];draw();};
  add(card,slot,bankEl,h("div",{class:"actions"},reset,check));
  draw();
}

function rGap(q,finish,card){
  if(q.inline){
    add(card,head(q),h("p",{class:"q sentence"},q.before,h("span",{class:"blank"}),q.after),
      h("p",{class:"note",text:"Write the missing word exactly as on your sheet."}));
  }else{
    add(card,head(q),h("p",{class:"q",text:q.prompt}),q.map?mapEl():null);
  }
  const inp=h("input",{class:"txt",id:"gap-answer",type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:q.inline?"Type the missing word":"Type the name","aria-label":"Your answer"});
  const note=h("p",{class:"note"});
  const hintBtn=h("button",{class:"btn ghost",type:"button",text:"Hint"});
  const check=h("button",{class:"btn",type:"button",text:"Check"});
  let hinted=false;
  hintBtn.onclick=()=>{
    hinted=true;const w=q.answer;
    const words=w.split(" ").length,letters=w.replace(/[^A-Za-zÀ-ÿ]/g,"").length;
    note.textContent="Starts with "+w[0]+". "+words+(words===1?" word":" words")+", "+letters+" letters.";
    inp.focus();
  };
  const submit=()=>{
    const v=norm(inp.value);
    if(!v){inp.focus();return;}
    const ok=q.accept.some(a=>norm(a)===v);
    inp.disabled=true;check.disabled=true;hintBtn.disabled=true;
    inp.classList.add(ok?"good":"bad");
    const bl=card.querySelector(".blank");
    if(bl){bl.textContent=q.answer;bl.classList.add(ok?"good":"bad");}
    finish(ok,{hint:hinted,answer:q.answer});
  };
  check.onclick=submit;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  add(card,inp,note,h("div",{class:"actions"},hintBtn,check));
}

function rMatch(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Tap an English name on the left, then its Spanish name on the right."}));
  const Lf=shuffle(q.pairs),Rt=shuffle(q.pairs);
  let sl=null,sr=null,solved=0,locked=false;const mist=new Set();
  function resolve(){
    const a=sl,b=sr;sl=sr=null;
    if(a.p===b.p){
      [a.b,b.b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true;});
      solved++;
      if(solved===q.pairs.length)finish(mist.size===0,{pairs:q.pairs.filter(p=>mist.has(p))});
    }else{
      mist.add(a.p);mist.add(b.p);locked=true;
      [a.b,b.b].forEach(x=>x.classList.add("wrong"));
      setTimeout(()=>{[a.b,b.b].forEach(x=>x.classList.remove("wrong","sel"));locked=false;},650);
    }
  }
  const mk=(p,side)=>{
    const b=h("button",{class:"mbtn",type:"button",text:side==="l"?p.l:p.r});
    b.onclick=()=>{
      if(locked||b.classList.contains("done"))return;
      if(side==="l"){if(sl)sl.b.classList.remove("sel");sl={p,b};}
      else{if(sr)sr.b.classList.remove("sel");sr={p,b};}
      b.classList.add("sel");
      if(sl&&sr)resolve();
    };
    return b;
  };
  add(card,h("div",{class:"mgrid"},h("div",{class:"mcol"},Lf.map(p=>mk(p,"l"))),h("div",{class:"mcol"},Rt.map(p=>mk(p,"r")))));
}

/* ---------- results and reading ---------- */
function showResults(){
  const r=round,n=r.qs.length,s=r.score,uniq=[...new Set(r.missed)];
  const msg=s===n?"Perfect! Every single one.":s/n>=.7?"Great work!":s/n>=.4?"Good try. One more round will help.":"Keep going. Read the map, then try again.";
  $app.replaceChildren(...[
    h("section",{class:"card"},h("div",{class:"qtype",text:"Round finished"}),h("p",{class:"big",text:s+" / "+n}),h("p",{class:"q",text:msg})),
    uniq.length?h("section",{class:"card"},h("div",{class:"qtype",text:"Practise these"}),...uniq.map(t=>h("p",{class:"rev",text:t}))):null,
    h("div",{class:"actions"},
      h("button",{class:"btn",type:"button",text:"Play again",onclick:()=>start(r.mode)}),
      h("button",{class:"btn ghost",type:"button",text:"Menu",onclick:showMenu}))
  ].filter(Boolean));
  window.scrollTo(0,0);
}
function showRead(){
  const top=h("div",{class:"top"},h("button",{class:"back",type:"button",text:"← Menu",onclick:showMenu}));
  const mapCard=h("section",{class:"card read"},h("h2",{text:"The map"}),mapEl());
  const list=h("section",{class:"card read"},
    h("h2",{text:"The 16 names"}),
    ...R.map(r=>h("div",{class:"row"},h("div",{class:"num",text:r.n}),h("div",null,h("div",{class:"en",text:r.en}),h("div",{class:"es",text:r.es}),r.alt.length?h("div",{class:"alt",text:"Also: "+r.alt.join(" · ")}):null,NOTE[r.n]?h("div",{class:"alt",text:NOTE[r.n]}):null))),
    h("p",{class:"note",text:"Numbers 16 and 17 are on the map but are not part of this game. The names after \"Also\" come from an online map game. Use the sheet names first."}));
  $app.replaceChildren(top,mapCard,list,h("button",{class:"btn",type:"button",style:"width:100%",text:"Back to the menu",onclick:showMenu}));
  window.scrollTo(0,0);
}
showMenu();
</script>
