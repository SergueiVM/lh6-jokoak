<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivers of Spain</title>
<style>
/* Same warm look as the other games: rounded cards, big tap targets, one column. */
:root{
  --bg:#fff4e0; --card:#ffffff; --ink:#2b2350; --muted:#6a6286; --line:#e8d9bd;
  --pri:#e5502c; --on-pri:#ffffff; --sec:#5b4bdb; --sec-text:#5b4bdb; --chip:#fff8ea;
  --good:#1b7f45; --good-bg:#e1f5e8; --bad:#c3342c; --bad-bg:#fde6e3; --focus:#5b4bdb;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff; color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--font)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:6px 0}

a[href="/"]{display:inline-flex;align-items:center;min-height:44px;color:var(--sec-text);font-weight:800;text-decoration:none}
.hero h1{font-size:30px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 4px}
h2.grp{font-size:15px;margin:26px 0 2px;text-transform:uppercase;letter-spacing:.06em;color:var(--sec-text);border-bottom:2px solid var(--line);padding-bottom:6px}

.lvls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.lvl{display:block;text-align:left;min-height:68px;padding:12px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.lvl b{display:block;font-size:20px}
.lvl span{color:var(--muted);font-size:15px}
.lvl.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}

.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;cursor:pointer;font-size:17px}
.mode:hover{border-color:var(--pri)}
.ico{font-size:38px;flex:none}
.t,.d{display:block}
.t{font-weight:800;font-size:19px}
.d{color:var(--muted);font-size:15px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.prog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:30px}
.bar{height:100%;background:var(--pri);border-radius:99px}
.count{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.qtype{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sec-text)}
.lead{margin:8px 0 10px;color:var(--muted);font-style:italic}
.q{font-size:20px;font-weight:700;margin:8px 0 12px;text-wrap:pretty}

.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hint{color:var(--muted);font-size:14px}
.zoom{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.zoom[aria-pressed="true"]{border-color:var(--sec);box-shadow:0 0 0 2px var(--sec)}
.mapwrap{border:2px solid var(--line);border-radius:16px;overflow:auto;background:#fff;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.mapwrap.zoomed{max-height:62vh}
.mapin{position:relative;line-height:0;width:100%}
.mapin img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.mapin{cursor:pointer}
.dt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#1e90ff;border:2px solid #fff;box-shadow:0 0 0 1px #0a2a66;pointer-events:none}
.mk{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:5px solid var(--pri);background:rgba(255,255,255,.25);box-shadow:0 0 0 3px #fff,0 0 0 5px #2b2350;pointer-events:none}
.mk.good{border-color:#1b9d52}
.mk.bad{border-color:#d3302a}
@media (prefers-reduced-motion:no-preference){
  .mk.hl{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.18)}}
}

.learnname{font-size:30px;font-weight:800;text-align:center;margin:14px 0 6px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip,.tag{min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:17px;cursor:pointer;display:inline-flex;align-items:center}
.tag{min-height:40px;cursor:default}
.chip.in{background:var(--card);border-color:var(--sec);box-shadow:0 0 0 2px var(--sec)}

.opts{display:grid;gap:10px}
.opts.tfs{grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;min-height:56px;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:18px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}

.txt{width:100%;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:20px}
.txt.good{border-color:var(--good);background:var(--good-bg)}
.txt.bad{border-color:var(--bad);background:var(--bad-bg)}
.note{color:var(--muted);min-height:1.4em;margin-top:8px}

.btn{min-height:56px;padding:0 22px;border:2px solid var(--pri);border-radius:16px;background:var(--pri);color:var(--on-pri);font-size:18px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 140px}

.fb{border-radius:18px;padding:14px 16px;border:2px solid;margin-bottom:14px}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .btn{width:100%;margin-top:14px}
.big{font-size:52px;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums}
</style>
</head>

let level=1, zoomed=false;
const $=s=>document.querySelector(s);
const app=$("#app");
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const ids=()=>Object.keys(LV[level].pts);
const nm=id=>RV[id].n;
/* typing: ignore case, accents, spaces and the word "river"; Spanish names are accepted too */
const fold=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\b(river|rio)\b/g," ").replace(/[^a-z]/g,"");
const accepts=(id,t)=>{const f=fold(t);return !!f&&[RV[id].n,...(RV[id].alt||[])].some(x=>fold(x)===f);};
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}}return d[b.length];};
const set=h=>{app.innerHTML=h;window.scrollTo(0,0);};

function mapBox(){

}

    clear(){mk.innerHTML="";},
    mark(id,cls){const p=L.pts[id];mk.insertAdjacentHTML("beforeend",`<b class="mk ${cls}" style="left:${p[0]}%;top:${p[1]}%"></b>`);},
    center(id){const p=L.pts[id];mw.scrollLeft=p[0]/100*mi.clientWidth-mw.clientWidth/2;mw.scrollTop=p[1]/100*mi.clientHeight-mw.clientHeight/2;},
    nearest(ev){const r=mi.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=null,bd=1e9;
      for(const id of Object.keys(L.pts)){const p=L.pts[id],d=Math.hypot(x-p[0]/100*r.width,y-p[1]/100*r.height);if(d<bd){bd=d;best=id;}}
      return {id:best,d:bd};},
    onTap(fn){mi.addEventListener("click",ev=>fn(api.nearest(ev)));}
  };
  /* visible blue dots on top of the picture, so they can be seen at any size */
  $("#dt").innerHTML=Object.keys(L.pts).map(k=>`<b class="dt" style="left:${L.pts[k][0]}%;top:${L.pts[k][1]}%"></b>`).join("");
  const apply=()=>{mi.style.width=zoomed?"230%":"100%";mw.classList.toggle("zoomed",zoomed);zb.textContent=zoomed?"🔍 Zoom out":"🔍 Zoom in";zb.setAttribute("aria-pressed",String(zoomed));};
  zb.onclick=()=>{zoomed=!zoomed;apply();if(api.focus)api.center(api.focus);};
  apply();
  return api;
}
const backBtn=()=>{const b=$("#bk");if(b)b.onclick=menu;};

/* ---------- menu (the only screen with the Home link) ---------- */
function mode(k,ico,t,d){return `<button class="mode" data-k="${k}"><span class="ico">${ico}</span><span><span class="t">${t}</span><span class="d">${d}</span></span></button>`;}
function menu(){
  const L=LV[level];
  set(`<a href="/">🏠 Home</a>
  <div class="hero"><h1>🌊 Rivers of Spain</h1><p class="sub">Find each river on the map and learn its name.</p></div>
  <h2 class="grp">Level</h2>
  <div class="lvls">
    <button class="lvl${level===1?" on":""}" data-l="1" aria-pressed="${level===1}"><b>Level 1</b><span>Main rivers · 8</span></button>
    <button class="lvl${level===2?" on":""}" data-l="2" aria-pressed="${level===2}"><b>Level 2</b><span>All rivers · 18</span></button>
  </div>
  <h2 class="grp">Learn</h2>
  ${mode("learn","📖","Look &amp; learn","See every river and its name")}
  ${L.groups.map((g,i)=>mode("g"+i,g.icon,"Study: "+g.title,g.ids.length+" rivers")).join("")}
  <h2 class="grp">Practice</h2>
  ${mode("choose","🔎","Which river is it?","Pick the name of the marked river")}
  ${mode("tap","👆","Tap the river","Find the river on the map")}
  ${mode("type","⌨️","Type the name","Write the name of the marked river")}
  ${mode("tf","✅","True or false?","Is the name right?")}
  ${mode("mix","🎲","Mix","All kinds of questions")}`);
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{level=+b.dataset.l;menu();});
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,all=ids();
    if(k==="learn")learn(all,null);
    else if(k[0]==="g")learn(L.groups[+k.slice(1)].ids,L.groups[+k.slice(1)]);
    else startRound(all,k==="mix"?ALLK:[k],{});
  });
}

/* ---------- look & learn ---------- */
function learn(list,group){
  set(`<div class="top"><button class="back" id="bk">← Menu</button></div>
  <div class="card"><div class="qtype">${group?group.title:"Look &amp; learn"}</div>
  <p class="lead">Tap a blue dot on the map, or a name below.</p>
  ${mapBox()}
  <div class="learnname" id="ln" aria-live="polite">&nbsp;</div>
  <div class="chips">${list.map(id=>`<button class="chip" data-id="${id}">${nm(id)}</button>`).join("")}</div>
  <div class="actions"><button class="btn ghost" id="pv">◀ Previous</button><button class="btn" id="nx">Next ▶</button></div>
  ${group?`<div class="actions"><button class="btn" id="qz">Quiz me on these ${list.length} rivers</button></div>`:""}</div>`);
  backBtn();
  const m=initMap();let cur=null;
  const show=id=>{cur=id;m.clear();m.mark(id,"hl");m.focus=id;if(zoomed)m.center(id);$("#ln").textContent=nm(id);
    app.querySelectorAll(".chip").forEach(c=>c.classList.toggle("in",c.dataset.id===id));};
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>show(c.dataset.id));
  m.onTap(n=>{if(n.d<=HIT)show(n.id);});
  const step=d=>{const i=list.indexOf(cur);show(list[i<0?(d>0?0:list.length-1):(i+d+list.length)%list.length]);};
  $("#nx").onclick=()=>step(1);$("#pv").onclick=()=>step(-1);
  if(group)$("#qz").onclick=()=>startRound(list,ALLK,{twice:true});
}

/* ---------- quiz rounds ---------- */
function startRound(list,kinds,opt){
  let qs=[];
  if(opt.twice){
    list.forEach(id=>shuffle(kinds).slice(0,Math.min(2,kinds.length)).forEach(k=>qs.push({id,kind:k})));
    for(let t=0;t<40;t++){const s=shuffle(qs);qs=s;if(s.every((q,j)=>!j||q.id!==s[j-1].id))break;}
  }else qs=shuffle(list).slice(0,Math.min(10,list.length)).map(id=>({id,kind:kinds[rnd(kinds.length)]}));
  let i=0,score=0;const miss=[];
  const again=()=>startRound(list,kinds,opt);

  function finish(q,ok,html){
    if(ok)score++;else if(!miss.includes(q.id))miss.push(q.id);
    const last=i===qs.length-1;
    $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"✅ Correct!":"❌ Not quite."}</b> ${html}<button class="btn" id="nx">${last?"See results":"Next ▶"}</button></div>`;
    const nx=$("#nx");nx.onclick=()=>{i++;next();};nx.focus({preventScroll:true});
    $("#fb").scrollIntoView({block:"nearest"});
  }
  function next(){i>=qs.length?results():ask(qs[i]);}

  function ask(q){
    const id=q.id,n=nm(id);let title="",ctl="";
    if(q.kind==="choose"){
      title="Which river is marked on the map?";
      const o=shuffle([id,...shuffle(ids().filter(x=>x!==id)).slice(0,3)]);
      ctl=`<div class="opts">${o.map(x=>`<button class="opt" data-id="${x}">${nm(x)}</button>`).join("")}</div>`;
    }else if(q.kind==="tf"){
      q.truth=rnd(2)===0;q.shown=q.truth?id:shuffle(ids().filter(x=>x!==id))[0];
      title=`The marked river is the <b>${nm(q.shown)}</b>.`;
      ctl=`<div class="opts tfs"><button class="opt" data-v="1">✔ True</button><button class="opt" data-v="0">✘ False</button></div>`;
    }else if(q.kind==="type"){
      title="Type the name of the marked river.";
      ctl=`<input class="txt" id="tx" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="River name" placeholder="River name"><div class="actions"><button class="btn" id="ck">Check</button></div>`;
    }else{
      title=`Tap the <b>${n}</b> on the map.`;
      ctl=`<div class="note" id="nt">${level===2?"Tip: use Zoom to tap the small northern rivers.":""}</div>`;
    }
    set(`<div class="top"><button class="back" id="bk">← Menu</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${i}"><div class="bar" style="width:${i/qs.length*100}%"></div></div>
      <span class="count">${i+1}/${qs.length}</span></div>
      <div class="card"><div class="qtype">${KLAB[q.kind]}</div><div class="q">${title}</div>${mapBox()}<div style="height:14px"></div>${ctl}</div>
      <div id="fb" aria-live="polite"></div>`);
    backBtn();
    const m=initMap();
    if(q.kind!=="tap"){m.mark(id,"hl");m.focus=id;if(zoomed)m.center(id);}
    const reveal=()=>{m.clear();m.mark(id,"good");};
    let done=false;

    if(q.kind==="choose"){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(done)return;done=true;const ok=b.dataset.id===id;
        app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.id===id)x.classList.add("good");});
        if(!ok)b.classList.add("bad");
        reveal();finish(q,ok,ok?`This is the <b>${n}</b>.`:`The answer is the <b>${n}</b>.`);
      });
    }else if(q.kind==="tf"){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(done)return;done=true;const ok=(b.dataset.v==="1")===q.truth;
        app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===q.truth)x.classList.add("good");});
        if(!ok)b.classList.add("bad");
        reveal();finish(q,ok,q.truth?`Yes, this is the <b>${n}</b>.`:`No, this is the <b>${n}</b>, not the ${nm(q.shown)}.`);
      });
    }else if(q.kind==="type"){
      const tx=$("#tx"),go=()=>{
        if(done||!tx.value.trim())return;done=true;
        const ok=accepts(id,tx.value);tx.disabled=true;$("#ck").disabled=true;tx.classList.add(ok?"good":"bad");
        reveal();
        let msg;
        if(ok)msg=fold(tx.value)===fold(n)?`This is the <b>${n}</b>.`:`In English: <b>${n}</b>.`;
        else msg=`The answer is <b>${n}</b>.`+(lev(fold(tx.value),fold(n))<=2?" Check the spelling.":"");
        finish(q,ok,msg);
      };
      $("#ck").onclick=go;tx.onkeydown=e=>{if(e.key==="Enter")go();};
    }else{
      m.onTap(t=>{
        if(done)return;
        if(t.d>HIT){$("#nt").textContent="Tap closer to a blue dot.";return;}
        done=true;const ok=t.id===id;m.clear();m.mark(id,"good");if(!ok)m.mark(t.id,"bad");
        finish(q,ok,ok?`That's the <b>${n}</b>.`:`That was the <b>${nm(t.id)}</b>. The <b>${n}</b> is the green circle.`);
      });
    }
  }

  function results(){
    const p=score/qs.length,uniq=[...new Set(miss)];
    const msg=p>=.9?"🌟 Amazing!":p>=.7?"👏 Great job!":p>=.5?"💪 Getting there!":"🌱 Keep practising!";
    set(`<div class="card" style="text-align:center"><div class="qtype">Results</div><div class="big">${score} / ${qs.length}</div><p class="q">${msg}</p></div>
    ${uniq.length?`<div class="card"><div class="qtype">Rivers to review</div><div class="chips">${uniq.map(x=>`<span class="tag">${nm(x)}</span>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="lm">📖 Look at them</button><button class="btn" id="pm">Practise these</button></div></div>`
      :`<div class="card"><p class="q">No mistakes. You found every river! 🎉</p></div>`}
    <div class="actions"><button class="btn" id="ag">Play again</button><button class="btn ghost" id="mn">Menu</button></div>`);
    $("#ag").onclick=again;$("#mn").onclick=menu;
    if(uniq.length){$("#lm").onclick=()=>learn(uniq,null);$("#pm").onclick=()=>startRound(uniq,ALLK,{twice:true});}
  }
  next();
}
menu();
</script>
</body>
</html>
