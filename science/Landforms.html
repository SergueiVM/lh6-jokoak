<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Landforms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of rounded cards, big tap targets. Menu -> round (one question per screen) -> results. Same warm palette as the other study games. */
:root{
  --bg:#fff4e0; --card:#ffffff; --ink:#2b2350; --muted:#6a6286; --line:#e8d9bd;
  --pri:#e5502c; --on-pri:#ffffff; --sec:#5b4bdb; --sec-text:#5b4bdb; --chip:#fff8ea;
  --good:#1b7f45; --good-bg:#e1f5e8; --bad:#c3342c; --bad-bg:#fde6e3; --focus:#5b4bdb;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1838; --card:#2a2350; --ink:#fff3de; --muted:#b9b1d6; --line:#443b75;
  --pri:#ff7a5c; --on-pri:#1d1838; --sec:#8f82ff; --sec-text:#b9afff; --chip:#342b63;
  --good:#6fd99a; --good-bg:#1f4034; --bad:#ff9b92; --bad-bg:#4a2339; --focus:#b9afff; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--font)}
main{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:6px 0}

.home{display:inline-flex;align-items:center;min-height:44px;color:var(--sec-text);font-weight:800;text-decoration:none}
.hero h1{font-size:30px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 4px}
h2.grp{font-size:15px;margin:26px 0 2px;text-transform:uppercase;letter-spacing:.06em;color:var(--sec-text);border-bottom:2px solid var(--line);padding-bottom:6px}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;cursor:pointer;font-size:17px}
.mode:hover{border-color:var(--pri)}
.ico{font-size:38px;flex:none}
.t,.d{display:block}
.t{font-weight:800;font-size:19px}
.d{color:var(--muted);font-size:15px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
.prog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:30px}
.bar{height:100%;background:var(--pri);border-radius:99px}
.count,.score{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.qtype{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sec-text)}
.lead{margin:10px 0 0;color:var(--muted);font-style:italic}
.q{font-size:20px;font-weight:700;margin:8px 0 12px;text-wrap:pretty}
.sentence{line-height:1.7}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--pri);text-align:center;padding:0 6px;margin:0 2px}
.blank.good{border-color:var(--good);color:var(--good)}
.blank.bad{border-color:var(--bad);color:var(--bad)}
.pic{margin:12px 0 4px;border-radius:16px;overflow:hidden;border:2px solid var(--line)}
.pic svg{display:block;width:100%;height:auto}

.opts{display:grid;gap:10px}
.opt{display:block;width:100%;min-height:56px;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:18px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.good,.mbtn.done{background:var(--good-bg);border-color:var(--good)}
.opt.bad,.mbtn.wrong{background:var(--bad-bg);border-color:var(--bad)}

.btn{min-height:56px;padding:0 22px;border:2px solid var(--pri);border-radius:16px;background:var(--pri);color:var(--on-pri);font-size:18px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 140px}

.slot,.bank{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-width:0}
.slot{min-height:68px;padding:10px;border:2px dashed var(--line);border-radius:16px;margin-bottom:14px}
.slot.good{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.ph{color:var(--muted);align-self:center}
.chip{min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:17px;text-align:left;cursor:pointer;max-width:100%}
.chip.in{background:var(--card);border-color:var(--sec)}
.chip:disabled{cursor:default;color:var(--ink)}

.txt{width:100%;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);font-size:20px}
.txt.good{border-color:var(--good);background:var(--good-bg)}
.txt.bad{border-color:var(--bad);background:var(--bad-bg)}
.note{color:var(--muted);min-height:1.4em;margin-top:8px}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start;min-width:0}
.mbtn{width:100%;min-height:62px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font-size:16px;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--sec);background:var(--card);box-shadow:0 0 0 2px var(--sec)}
.mbtn.done{cursor:default;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .mbtn.wrong{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}

.fb{border-radius:18px;padding:14px 16px;border:2px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .ans,.fb .src{margin-top:8px}
.lab{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fb .btn{width:100%;margin-top:14px}

.big{font-size:52px;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums}
.rev{margin:10px 0;padding-top:10px;border-top:2px solid var(--line)}
.read h2{font-size:21px;margin:4px 0 10px;text-wrap:balance}
.read h3{font-size:15px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--sec-text)}
.read .item{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.read .item:first-of-type{border-top:0}
.read .item .pic{margin:0}
.read .nm{font-weight:800}
</style>

<main id="app"></main>

<script>
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const norm=s=>s.toLowerCase().replace(/[.,;:!?]+$/,"").replace(/\s*-\s*/g,"-").replace(/\s+/g," ").trim();

/* ---------- DATA: every definition is copied from the worksheet (numbers 1-8, letters a-h) ---------- */
const L=[
{id:"plateau", name:"Plateau",  def:"An area of land that is higher than the land around it, but flat", grp:"l1"},
{id:"hill",    name:"Hill",     def:"A small mound", grp:"l2"},
{id:"mountain",name:"Mountain", def:"A tall piece of land, usually with steep sides", grp:"l1"},
{id:"lake",    name:"Lake",     def:"A small body of water, with land all around it", grp:"w1"},
{id:"river",   name:"River",    def:"A line of water; can be curvy", grp:"w2"},
{id:"ocean",   name:"Ocean",    def:"A very large body of water", grp:"w1"},
{id:"plain",   name:"Plain",    def:"Flat, open land", grp:"l2"},
{id:"island",  name:"Island",   def:"A small piece of land with water all around it", grp:"w2"}
];
const byId=id=>L.find(x=>x.id===id);

/* Pictures: my own simple drawings (not the worksheet photos). */
const SKY="#cfe9f7";
const svgWrap=inner=>`<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">${inner}</svg>`;
const PIC={
plateau:svgWrap(`<rect width="200" height="100" fill="${SKY}"/><path d="M0 100V80H48L72 44H146L172 80H200V100Z" fill="#9a7b4f"/><path d="M72 44H146" stroke="#6f5632" stroke-width="3" stroke-linecap="round"/>`),
hill:svgWrap(`<rect width="200" height="100" fill="${SKY}"/><path d="M0 100V82Q55 82 100 38Q145 82 200 82V100Z" fill="#6fa14d"/>`),
mountain:svgWrap(`<rect width="200" height="100" fill="${SKY}"/><path d="M0 100L48 58L78 78L120 14L172 74L200 100Z" fill="#7d8090"/><path d="M120 14L102 42L113 37L121 47L131 37L142 44Z" fill="#ffffff"/><path d="M48 58L38 72L47 68L53 74L60 67Z" fill="#ffffff"/>`),
lake:svgWrap(`<rect width="200" height="100" fill="#7ba951"/><ellipse cx="100" cy="50" rx="56" ry="27" fill="#4aa3d8"/><path d="M78 46q8-5 16 0M108 58q8-5 16 0" stroke="#bfe3f6" stroke-width="3" fill="none" stroke-linecap="round"/>`),
river:svgWrap(`<rect width="200" height="100" fill="#7ba951"/><path d="M-10 84C40 96 50 22 100 52S158 92 210 18" stroke="#4aa3d8" stroke-width="13" fill="none" stroke-linecap="round"/>`),
ocean:svgWrap(`<rect width="200" height="100" fill="#3b8fd0"/><path d="M10 28q10-8 20 0t20 0t20 0M110 22q10-8 20 0t20 0t20 0M40 58q10-8 20 0t20 0t20 0M130 68q10-8 20 0t20 0M0 84q10-8 20 0t20 0t20 0" stroke="#bfe3f6" stroke-width="3" fill="none" stroke-linecap="round"/>`),
plain:svgWrap(`<rect width="200" height="100" fill="${SKY}"/><rect y="62" width="200" height="38" fill="#8db75a"/><path d="M30 82l3-8l3 8M90 88l3-8l3 8M150 80l3-8l3 8M170 92l3-8l3 8" stroke="#5f8a38" stroke-width="2.5" fill="none" stroke-linecap="round"/>`),
island:svgWrap(`<rect width="200" height="100" fill="#4aa3d8"/><ellipse cx="100" cy="52" rx="44" ry="20" fill="#e6cf92"/><ellipse cx="100" cy="48" rx="30" ry="12" fill="#6fa14d"/><path d="M14 20q8-6 16 0t16 0M150 82q8-6 16 0t16 0" stroke="#bfe3f6" stroke-width="3" fill="none" stroke-linecap="round"/>`)
};

/* Sentences for the exact-wording modes. lead = the landform name; ch = pieces for ordering; gaps = words to blank; sw = swaps that make a near-identical wrong version. */
const S=[
{id:"s0",t:"Landforms are the shapes that the land takes (forms).",ch:"Landforms are | the shapes | that the land takes | (forms).",gaps:["shapes","takes"],sw:[["land takes","water takes"],["shapes","sizes"],["Landforms","Landmarks"],["takes","makes"]]},
{id:"plateau",lead:"Plateau:",t:L[0].def,ch:"An area of land | that is higher | than the land around it, | but flat",gaps:["area","higher","around","flat"],sw:[["higher","lower"],["but flat","and steep"],["An area","A piece"],["land around","water around"]]},
{id:"hill",lead:"Hill:",t:L[1].def,ch:"A small mound",gaps:["small","mound"],sw:[["small mound","tall mound"],["mound","mountain"],["small","large"],["mound","hole"]]},
{id:"mountain",lead:"Mountain:",t:L[2].def,ch:"A tall piece of land, | usually | with steep sides",gaps:["tall","land","usually","steep","sides"],sw:[["tall","small"],["usually","never"],["steep sides","flat sides"],["piece of land","body of water"]]},
{id:"lake",lead:"Lake:",t:L[3].def,ch:"A small body of water, | with land | all around it",gaps:["small","body","water","land","around"],sw:[["small","very large"],["with land all around it","with water all around it"],["body of water","piece of land"],["land all around","land on one side"]]},
{id:"river",lead:"River:",t:L[4].def,ch:"A line | of water; | can be curvy",gaps:["line","water","curvy"],sw:[["line","circle"],["curvy","straight"],["water","land"],["can be","must be"]]},
{id:"ocean",lead:"Ocean:",t:L[5].def,ch:"A very large | body | of water",gaps:["very","large","body","water"],sw:[["very large","small"],["body of water","piece of land"],["very","quite"],["large","long"]]},
{id:"plain",lead:"Plain:",t:L[6].def,ch:"Flat, | open land",gaps:["Flat","open","land"],sw:[["Flat","Tall"],["open","closed"],["land","water"],["Flat, open","Flat, high"]]},
{id:"island",lead:"Island:",t:L[7].def,ch:"A small piece of land | with water | all around it",gaps:["small","piece","land","water","around"],sw:[["small","very large"],["with water all around it","with land all around it"],["piece of land","body of water"],["water all","water on one side"]]}
];

const pickN=(a,n)=>shuffle(a).slice(0,n);
const sentSrc=s=>(s.lead?s.lead+" ":"")+s.t;
const choiceQ=o=>({type:"choice",label:o.label||"Quick quiz",q:o.q,lead:o.lead,svg:o.svg,options:shuffle([o.a].concat(o.w)),correct:o.a,srcText:o.srcText,sid:o.s});
const landSrc=l=>l.name+": "+l.def;
function exactQ(s){
  const wrong=[],used=new Set([s.t]);
  for(const [a,b] of shuffle(s.sw)){const v=s.t.replace(a,b);if(!used.has(v)){used.add(v);wrong.push(v);if(wrong.length===3)break;}}
  return choiceQ({label:"Exact sentence",q:"Which one is exactly the same as on your worksheet?",lead:s.lead,a:s.t,w:wrong,s:s.id});
}
function gapQ(s,w){const i=s.t.indexOf(w);return{type:"gap",label:"Fill the gap",lead:s.lead,before:s.t.slice(0,i),after:s.t.slice(i+w.length),answer:w,accept:[w],sid:s.id};}
function orderQ(s){
  const parts=s.ch.split("|").map(x=>x.trim());
  let sh=parts.map((t,i)=>({t,i}));
  do{sh=shuffle(sh);}while(sh.every((x,i)=>x.i===i));
  return{type:"order",label:"Put it in order",lead:s.lead,parts:sh,target:s.t,sid:s.id};
}

const POOL={choice:[],picture:[],order:[],gap:[],exact:[],match:[]};
L.forEach(l=>{
  const others=L.filter(x=>x!==l);
  POOL.choice.push({id:"n-"+l.id,grp:l.id+":n",build:()=>choiceQ({q:'Which landform is: "'+l.def+'"?',a:l.name,w:pickN(others,3).map(x=>x.name),srcText:landSrc(l)})});
  POOL.choice.push({id:"d-"+l.id,grp:l.id+":d",build:()=>choiceQ({q:'What is the definition of "'+l.name+'"?',a:l.def,w:pickN(others,3).map(x=>x.def),srcText:landSrc(l)})});
  POOL.picture.push({id:"pn-"+l.id,grp:l.id+":p",build:()=>choiceQ({label:"Look and name",q:"Which landform is this?",svg:PIC[l.id],a:l.name,w:pickN(others,3).map(x=>x.name),srcText:landSrc(l)})});
  POOL.picture.push({id:"pd-"+l.id,grp:l.id+":p",build:()=>choiceQ({label:"Picture and sentence",q:"Which sentence describes this picture?",svg:PIC[l.id],a:l.def,w:pickN(others,3).map(x=>x.def),srcText:landSrc(l)})});
  POOL.match.push({id:"m-"+l.id,grp:l.grp,l:l.name,r:l.def});
});
/* Concept contrasts */
const X=[
{id:"x1",s:"island",q:"Which landform has water all around it?",a:"Island",w:["Lake","Plateau","Plain"]},
{id:"x2",s:"lake",q:"Which landform has land all around it?",a:"Lake",w:["Island","Ocean","River"]},
{id:"x3",s:"plateau",q:"Which landform is higher than the land around it, but flat?",a:"Plateau",w:["Plain","Hill","Lake"]},
{id:"x4",s:"plain",q:"Which landform is flat, open land?",a:"Plain",w:["Mountain","Hill","Lake"]},
{id:"x5",s:"mountain",q:"Which landform usually has steep sides?",a:"Mountain",w:["Plain","Lake","River"]},
{id:"x6",s:"hill",q:"Which landform is a small mound?",a:"Hill",w:["Mountain","Island","Plateau"]},
{id:"x7",s:"river",q:"Which landform is a line of water that can be curvy?",a:"River",w:["Lake","Ocean","Island"]},
{id:"x8",s:"ocean",q:"Which of these is a very large body of water?",a:"Ocean",w:["Lake","River","Island"]},
{id:"x9",s:"lake",q:"Lake and ocean are both bodies of water. Which one is small?",a:"Lake",w:["Ocean"]},
{id:"x10",s:"s0",q:"What are landforms?",a:"The shapes that the land takes",w:["The shapes that the sea takes","The names of countries","Buildings made by people"]}
];
X.forEach(z=>POOL.choice.push({id:z.id,grp:"x:"+z.id,build:()=>choiceQ({q:z.q,a:z.a,w:z.w,srcText:z.s==="s0"?S[0].t:landSrc(byId(z.s))})}));
S.forEach(s=>{
  s.gaps.forEach(w=>POOL.gap.push({id:s.id+"|g|"+w,grp:s.id,build:()=>gapQ(s,w)}));
  if(s.ch.split("|").length>=3)POOL.order.push({id:s.id+"|o",grp:s.id,build:()=>orderQ(s)});
  POOL.exact.push({id:s.id+"|e",grp:s.id,build:()=>exactQ(s)});
});

/* ---------- engine ---------- */
const $app=document.getElementById("app");
let seen={};
try{seen=JSON.parse(localStorage.getItem("lf-seen")||"{}")||{};}catch(e){seen={};}
const bump=id=>{seen[id]=(seen[id]||0)+1;try{localStorage.setItem("lf-seen",JSON.stringify(seen));}catch(e){}};
const rank=items=>items.map(it=>({it,k:(seen[it.id]||0)+Math.random()*1.5})).sort((a,b)=>a.k-b.k).map(o=>o.it);

function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==="class")e.className=v;
    else if(k==="onclick")e.onclick=v;
    else if(k==="text")e.textContent=v;
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);}
  add(e,...kids);return e;
}
function add(p,...k){k.flat().forEach(x=>{if(x!=null&&x!==false)p.append(x);});return p;}
const picEl=svg=>{const d=h("div",{class:"pic"});d.innerHTML=svg;return d;};
const srcOf=q=>{
  if(q.srcText)return q.srcText;
  if(q.sid){const s=S.find(x=>x.id===q.sid);return s?sentSrc(s):"";}
  return "";
};

/* ---------- menu ---------- */
function showMenu(){
  round=null;
  const m=(mode,icon,t,d)=>`<button class="mode" type="button" data-mode="${mode}"><span class="ico">${icon}</span><span><span class="t">${t}</span><span class="d">${d}</span></span></button>`;
  $app.innerHTML=`<a class="home" href="/">🏠 Home</a>
<header class="hero"><h1>Landforms</h1><p class="sub">Science: plateau, hill, mountain, lake, river, ocean, plain and island. New questions every round.</p></header>
<h2 class="grp">Read first</h2>
${m("read","📖","Read the sheet","The 8 landforms with their sentences and pictures")}
<h2 class="grp">Concepts</h2>
${m("quiz","❓","Quick quiz","10 questions: names, definitions and differences")}
${m("picture","🖼️","Look and name","Which landform is in the picture?")}
${m("match","🔗","Match the pairs","2 boards: landform and its sentence")}
<h2 class="grp">Exact sentences</h2>
${m("order","🧩","Put it in order","Build the sentence from its pieces")}
${m("gap","✍️","Fill the gap","Type the missing words exactly")}
${m("exact","🎯","Pick the exact sentence","Only one is word for word")}
<h2 class="grp">Everything</h2>
${m("mix","🏆","Mix it up","12 questions of every kind")}`;
  $app.querySelectorAll("[data-mode]").forEach(b=>{b.onclick=()=>start(b.dataset.mode);});
  window.scrollTo(0,0);
}

/* ---------- rounds ---------- */
let round=null;
function start(mode){
  if(mode==="read")return showRead();
  round=buildRound(mode);
  showQ();
}
function pick(type,n,used){
  used=used||new Set();const out=[];
  for(const it of rank(POOL[type])){
    if(out.length>=n)break;
    if(used.has(it.grp))continue;
    used.add(it.grp);out.push(it);bump(it.id);
  }
  return out;
}
function pickMix(n){
  const types=shuffle(["choice","choice","choice","gap","gap","gap","order","order","exact","exact","picture","picture"]).slice(0,n);
  const used=new Set(),ranked={},out=[];
  types.forEach(t=>{
    ranked[t]=ranked[t]||rank(POOL[t]);
    const it=ranked[t].find(x=>!used.has(x.grp)&&!out.includes(x));
    if(it){used.add(it.grp);bump(it.id);out.push(it);}
  });
  return out;
}
function buildBoards(){
  const boards=[[],[]];
  for(const it of rank(POOL.match)){
    for(const b of boards){
      if(b.length<4&&!b.some(x=>x.grp===it.grp)){b.push(it);bump(it.id);break;}
    }
    if(boards.every(b=>b.length===4))break;
  }
  return boards.filter(b=>b.length>=2).map(b=>({type:"match",label:"Match the pairs",pairs:b}));
}
function buildRound(mode){
  const r={mode,qs:[],i:0,score:0,missed:[],answered:false};
  if(mode==="match"){r.qs=buildBoards();return r;}
  const items=mode==="quiz"?pick("choice",10)
    :mode==="picture"?pick("picture",8)
    :mode==="order"?pick("order",8)
    :mode==="gap"?pick("gap",10)
    :mode==="exact"?pick("exact",10)
    :pickMix(12);
  r.qs=items.map(it=>it.build());
  return r;
}

function showQ(){
  const r=round,q=r.qs[r.i];r.answered=false;
  const star=h("span",{class:"score",text:"⭐ "+r.score});
  const bar=h("div",{class:"bar"});bar.style.width=(r.i/r.qs.length*100)+"%";
  const top=h("div",{class:"top"},
    h("button",{class:"back",type:"button",text:"← Menu",onclick:showMenu}),
    h("div",{class:"prog","aria-hidden":"true"},bar),
    h("span",{class:"count",text:(r.i+1)+" / "+r.qs.length}),star);
  const card=h("section",{class:"card"});
  const fb=h("div",{role:"status","aria-live":"polite"});
  const finish=(ok,info)=>{
    info=info||{};
    if(r.answered)return;r.answered=true;
    if(ok&&!info.hint){r.score++;star.textContent="⭐ "+r.score;}
    const t=srcOf(q);
    if(!ok){
      if(q.type==="match")(info.pairs||[]).forEach(p=>r.missed.push(p.l+": "+p.r));
      else if(t)r.missed.push(t);
    }
    const last=r.i===r.qs.length-1;
    const box=h("div",{class:"fb "+(ok?"good":"bad")},
      h("strong",{text:ok?(info.hint?"Correct, but you used a hint, so no star.":"Correct! ⭐"):(q.type==="match"?"Finished. A few pairs needed another try.":"Not quite.")}),
      (!ok&&info.answer)?h("div",{class:"ans"},"The missing words: ",h("b",{text:info.answer})):null,
      t?h("div",{class:"src"},h("span",{class:"lab",text:"On your sheet"}),h("span",{text:t})):null,
      h("button",{class:"btn",type:"button",text:last?"See results":"Next →",onclick:()=>{r.i++;if(last)showResults();else showQ();}}));
    fb.replaceChildren(box);
    box.scrollIntoView({block:"nearest"});
  };
  ({choice:rChoice,order:rOrder,gap:rGap,match:rMatch})[q.type](q,finish,card);
  $app.replaceChildren(top,card,fb);
  window.scrollTo(0,0);
  const first=card.querySelector("input");if(first)first.focus({preventScroll:true});
}

const head=q=>[h("div",{class:"qtype",text:q.label}),q.lead?h("p",{class:"lead",text:q.lead}):null];

function rChoice(q,finish,card){
  const list=h("div",{class:"opts"});
  q.options.forEach(o=>{
    const b=h("button",{class:"opt",type:"button",text:o});
    b.onclick=()=>{
      [...list.children].forEach(x=>{x.disabled=true;if(x.textContent===q.correct)x.classList.add("good");});
      if(o!==q.correct)b.classList.add("bad");
      finish(o===q.correct);
    };
    list.append(b);
  });
  add(card,head(q),q.svg?picEl(q.svg):null,h("p",{class:"q",text:q.q}),list);
}

function rOrder(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Tap the pieces in the right order to build the sentence."}));
  let ans=[],bank=q.parts.slice(),locked=false;
  const slot=h("div",{class:"slot"}),bankEl=h("div",{class:"bank"});
  const check=h("button",{class:"btn",type:"button",text:"Check"});
  const reset=h("button",{class:"btn ghost",type:"button",text:"Start again"});
  const chip=(c,fn,cls)=>h("button",{class:"chip"+(cls?" "+cls:""),type:"button",text:c.t,disabled:locked,onclick:fn});
  function draw(cls){
    slot.className="slot"+(cls?" "+cls:"");
    slot.replaceChildren(...(ans.length
      ?ans.map(c=>chip(c,()=>{ans=ans.filter(x=>x!==c);bank.push(c);draw();},"in"))
      :[h("span",{class:"ph",text:"Your sentence goes here"})]));
    bankEl.replaceChildren(...bank.map(c=>chip(c,()=>{bank=bank.filter(x=>x!==c);ans.push(c);draw();})));
    check.disabled=locked||ans.length!==q.parts.length;
    reset.disabled=locked||!ans.length;
  }
  check.onclick=()=>{const ok=ans.map(c=>c.t).join(" ")===q.target;locked=true;draw(ok?"good":"bad");finish(ok);};
  reset.onclick=()=>{bank=q.parts.slice();ans=[];draw();};
  add(card,slot,bankEl,h("div",{class:"actions"},reset,check));
  draw();
}

function rGap(q,finish,card){
  add(card,head(q),h("p",{class:"q sentence"},q.before,h("span",{class:"blank"}),q.after),
    h("p",{class:"note",text:"Write the missing word exactly as on your sheet."}));
  const inp=h("input",{class:"txt",id:"gap-answer",type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"Type the missing word","aria-label":"Missing word"});
  const note=h("p",{class:"note"});
  const hintBtn=h("button",{class:"btn ghost",type:"button",text:"Hint"});
  const check=h("button",{class:"btn",type:"button",text:"Check"});
  let hinted=false;
  hintBtn.onclick=()=>{
    hinted=true;const w=q.answer;
    const words=w.split(" ").length,letters=w.replace(/[^A-Za-z0-9]/g,"").length;
    note.textContent="Starts with "+w[0]+". "+words+(words===1?" word":" words")+", "+letters+" letters.";
    inp.focus();
  };
  const submit=()=>{
    const v=norm(inp.value);
    if(!v){inp.focus();return;}
    const ok=q.accept.some(a=>norm(a)===v);
    inp.disabled=true;check.disabled=true;hintBtn.disabled=true;
    inp.classList.add(ok?"good":"bad");
    const bl=card.querySelector(".blank");bl.textContent=q.answer;bl.classList.add(ok?"good":"bad");
    finish(ok,{hint:hinted,answer:q.answer});
  };
  check.onclick=submit;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  add(card,inp,note,h("div",{class:"actions"},hintBtn,check));
}

function rMatch(q,finish,card){
  add(card,head(q),h("p",{class:"q",text:"Tap a landform on the left, then its sentence on the right."}));
  const Lf=shuffle(q.pairs),R=shuffle(q.pairs);
  let sl=null,sr=null,solved=0,locked=false;const mist=new Set();
  function resolve(){
    const a=sl,b=sr;sl=sr=null;
    if(a.p===b.p){
      [a.b,b.b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true;});
      solved++;
      if(solved===q.pairs.length)finish(mist.size===0,{pairs:q.pairs.filter(p=>mist.has(p))});
    }else{
      mist.add(a.p);mist.add(b.p);locked=true;
      [a.b,b.b].forEach(x=>x.classList.add("wrong"));
      setTimeout(()=>{[a.b,b.b].forEach(x=>x.classList.remove("wrong","sel"));locked=false;},650);
    }
  }
  const mk=(p,side)=>{
    const b=h("button",{class:"mbtn",type:"button",text:side==="l"?p.l:p.r});
    b.onclick=()=>{
      if(locked||b.classList.contains("done"))return;
      if(side==="l"){if(sl)sl.b.classList.remove("sel");sl={p,b};}
      else{if(sr)sr.b.classList.remove("sel");sr={p,b};}
      b.classList.add("sel");
      if(sl&&sr)resolve();
    };
    return b;
  };
  add(card,h("div",{class:"mgrid"},h("div",{class:"mcol"},Lf.map(p=>mk(p,"l"))),h("div",{class:"mcol"},R.map(p=>mk(p,"r")))));
}

/* ---------- results and reading ---------- */
function showResults(){
  const r=round,n=r.qs.length,s=r.score,uniq=[...new Set(r.missed)];
  const msg=s===n?"Perfect! Every single one.":s/n>=.7?"Great work!":s/n>=.4?"Good try. One more round will help.":"Keep going. Read the sheet, then try again.";
  $app.replaceChildren(...[
    h("section",{class:"card"},h("div",{class:"qtype",text:"Round finished"}),h("p",{class:"big",text:s+" / "+n}),h("p",{class:"q",text:msg})),
    uniq.length?h("section",{class:"card"},h("div",{class:"qtype",text:"Practise these"}),...uniq.map(t=>h("p",{class:"rev",text:t}))):null,
    h("div",{class:"actions"},
      h("button",{class:"btn",type:"button",text:"Play again",onclick:()=>start(r.mode)}),
      h("button",{class:"btn ghost",type:"button",text:"Menu",onclick:showMenu}))
  ].filter(Boolean));
  window.scrollTo(0,0);
}
function showRead(){
  const top=h("div",{class:"top"},h("button",{class:"back",type:"button",text:"← Menu",onclick:showMenu}));
  const intro=h("section",{class:"card read"},
    h("h2",{text:"Landforms"}),
    h("p",{text:S[0].t}),
    h("p",{text:"They're natural made."}));
  const items=h("section",{class:"card read"},
    h("h3",{text:"The 8 landforms"}),
    ...L.map((l,i)=>h("div",{class:"item"},picEl(PIC[l.id]),h("div",null,h("div",{class:"nm",text:(i+1)+". "+l.name}),h("div",{text:l.def})))),
    h("p",{class:"note",text:"These pictures are simple drawings. The ones on your sheet look a little different."}));
  $app.replaceChildren(top,intro,items,h("button",{class:"btn",type:"button",style:"width:100%",text:"Back to the menu",onclick:showMenu}));
  window.scrollTo(0,0);
}
showMenu();
</script>
